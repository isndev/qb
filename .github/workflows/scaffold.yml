# Runs the two scaffolding scripts a new user's very first command invokes.
#
# Nothing in any repo of this project has ever executed script/qb-new-project.sh or
# script/qb-new-module.sh -- `grep -rn 'qb-new-' .github/ scripts/` returned only the scripts
# themselves. That single gap is the direct cause of four shipped defects, and what makes them
# one class is that EVERY ONE OF THEM EXITED 0 WHILE PRODUCING A WRONG RESULT:
#
#   1. The module script cloned `isndev/qbm-sample`, which does not exist, and there was no
#      `set -e`. The clone failed, the `cd` failed, and `mkdir .git; mv * .git` then ran against
#      the USER'S INVOCATION DIRECTORY and swallowed its contents. Exit 0.
#   2. `git --bare init` took HEAD from the user's `init.defaultBranch` while the push named
#      `master`, the template's branch. With `init.defaultBranch=main`, HEAD pointed at a branch
#      that did not exist, `git reset --hard` succeeded against an unborn HEAD without writing a
#      file, and the script printed "Created" over a directory containing nothing but `.git`.
#      Exit 0. Fixed in 9e209efc.
#   3. `rm -rf "../${TEMPLATE}"` was computed relative to a user-supplied name, so a name with a
#      separator moved the deletion one directory up onto an unrelated checkout.
#   4. Nothing removed the half-built directory on failure, so the new guards then refused the
#      retry the user obviously wanted.
#
# `set -e` cannot see defect 2 -- no command failed -- and no compiler, linter or test in this
# tree looks at a shell script. A runner executing them is the only instrument that can.
#
# WHY BOTH `init.defaultBranch` SETTINGS, AND WHY IT IS NOT OPTIONAL. Three script designs were
# tried while fixing defect 2, and a single-configuration run passes TWO OF THE THREE:
#   `git --bare init` + push        -- broken when init.defaultBranch != the template's branch
#   `git init` + `git fetch +refs`  -- fetch refuses to write the branch HEAD is on, so this is
#                                      broken when init.defaultBranch == the template's branch
#   `git clone` into the target     -- takes HEAD from the source; correct under both
# Only running the matrix separates the third from the first two. Pinning one value here would
# reproduce exactly the blind spot that let defect 2 ship.
#
# THE BUILD LEG THIS LANE USED TO OMIT NOW EXISTS. It was omitted because both templates were
# two majors stale and did not compile against 3.0.0, so a build would have been red from its
# first run -- and a lane that ships red gets ignored or disabled. Both templates have since been
# rebuilt, so the omission's reason is gone and the leg is here: each job configures, builds and
# runs what the scaffolder produced. That closes the gap the four defects came through, because
# "the tree it claims to have produced" and "a tree that works" are different claims and only the
# second is what a user gets.
#
# WHAT THIS LANE IS NOT. It is not the templates' own CI. isndev/qb-sample-project and
# isndev/qb-sample-module each carry .github/workflows/template.yml, which renders with THIS
# script and builds the result on Linux and macOS. Those fire when the TEMPLATE changes; this one
# fires when qb changes. Both are needed: the scaffolder and the template are two halves of one
# product and either side can break the pair.
#
# COST. The scaffolders no longer clone submodules -- the generated tree resolves qb through
# FetchContent -- so the expensive part is now the compile, not the checkout. Both jobs build, and
# the branch matrix plus every negative control stays on the module job, which is the cheaper of
# the two.
name: scaffold

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scaffold-${{ github.ref }}
  cancel-in-progress: true

jobs:
  module:
    name: qb-new-module.sh (init.defaultBranch=${{ matrix.default_branch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        default_branch: [ master, main ]

    steps:
      - uses: actions/checkout@v6

      # THE VERSION BINDING, checked before anything is scaffolded. Each scaffolder carries the qb
      # version it ships with as a literal, and writes the matching ref into every tree it
      # generates. A literal nothing checks is a stale copy waiting to happen -- and this project
      # has fixed three of those already (the qbm project() lines, the User-Agent, 129
      # Verified-against markers). The guard also asserts the two scripts' shared body has not
      # drifted, which is the defect that once had the module script cloning a repository that
      # does not exist while its own `cd` named one that does.
      - name: Scaffolder consistency (version binding + shared body)
        run: ./scripts/check-scaffold-consistency.sh

      # An isolated global config, so `git config --global` below configures THIS JOB and not
      # whatever the runner image happens to ship. It is also what makes `init.defaultBranch` a
      # controlled variable rather than an assumption about the image.
      #
      # Exported through GITHUB_ENV rather than a job-level `env:` on purpose: the `runner`
      # context is NOT one of the contexts available to `jobs.<id>.env`, so `${{ runner.temp }}`
      # there is a workflow-parse error, not a value.
      - name: Git configuration under test
        env:
          DEFAULT_BRANCH: ${{ matrix.default_branch }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL="${RUNNER_TEMP}/gitconfig"
          echo "GIT_CONFIG_GLOBAL=${GIT_CONFIG_GLOBAL}" >> "${GITHUB_ENV}"
          : > "${GIT_CONFIG_GLOBAL}"
          git config --global init.defaultBranch "${DEFAULT_BRANCH}"
          # The anti-vacuity control below commits into a local stand-in template; the runner
          # image has no identity of its own.
          git config --global user.name  'scaffold ci'
          git config --global user.email 'scaffold-ci@example.invalid'
          git --version
          git config --global --list

      # THE RUN THAT MATTERS. Everything after this is a control proving this one is not vacuous.
      - name: Scaffold a module
        run: |
          set -euo pipefail
          inv="${RUNNER_TEMP}/scaffold-module"
          rm -rf "${inv}"; mkdir -p "${inv}"; cd "${inv}"

          rc=0
          bash "${GITHUB_WORKSPACE}/script/qb-new-module.sh" m || rc=$?
          [ "${rc}" -eq 0 ] || { echo "::error::qb-new-module.sh exited ${rc}"; exit 1; }

          tracked=$(git -C m ls-files | wc -l | tr -d '[:space:]')
          echo "tracked files: ${tracked}"
          [ "${tracked}" -gt 0 ] || {
            echo "::error::exit 0 over an empty checkout -- defect 2 is back"; exit 1; }

          # Defect 2's exact signature was a directory holding nothing but `.git`, which
          # `ls-files` alone would not have distinguished from a real checkout on every
          # possible failure. Asserted on the DISK, and without naming a file the template
          # could rename out from under this job.
          worktree=$(find m -mindepth 1 -maxdepth 1 -not -name .git | wc -l | tr -d '[:space:]')
          [ "${worktree}" -gt 0 ] || {
            echo "::error::'m' contains nothing but .git"; exit 1; }

          # The script claims to leave the result detached from the template. Nothing else
          # checks that, and a user who pushes to an upstream they did not know they had is a
          # worse outcome than a failed scaffold.
          remotes=$(git -C m remote)
          [ -z "${remotes}" ] || {
            echo "::error::the template remote survived: ${remotes}"; exit 1; }

          # THE RESULT IS A NEW REPOSITORY, not the template's history renamed. Exactly one
          # commit is the observable form of that, and it is what distinguishes the current
          # design from the `git clone` + `git remote remove origin` it replaced.
          commits=$(git -C m rev-list --count HEAD)
          [ "${commits}" -eq 1 ] || {
            echo "::error::${commits} commits in a freshly scaffolded module; expected exactly 1"; exit 1; }

          # RENDERING. The template ships @QB_NAME@ placeholders in file contents AND in path
          # names; a module whose directory was not renamed does not even configure, because
          # qb_register_module() requires src/qbm/<name>/. Both are asserted, and so is the
          # absence of the old template's own identifiers.
          [ -f m/src/qbm/m/m.h ] || {
            echo "::error::src/qbm/m/m.h missing -- the path placeholder was not rendered"; exit 1; }
          if grep -rIl '@QB_[A-Z_]*@' m --exclude-dir=.git 2>/dev/null | grep -q .; then
            echo "::error::unresolved placeholders survived rendering:"
            grep -rIl '@QB_[A-Z_]*@' m --exclude-dir=.git | sed 's/^/  /'; exit 1
          fi
          if grep -rIl 'qbm-sample\|qbm::sample' m --exclude-dir=.git | grep -q .; then
            echo "::error::the template's own name leaked into the generated module"; exit 1
          fi

          # A FLOOR, not a target. A template that grows must not read as a gate failure.
          [ "${tracked}" -ge 8 ] || {
            echo "::error::only ${tracked} tracked files, floor is 8"; exit 1; }
          echo "ok: ${tracked} tracked files, ${worktree} worktree entries, 1 commit, no remote"

      # NEGATIVE CONTROL 1 -- name validation.
      #
      # "It failed" is NOT the property under test. Defect 1 failed too, and destroyed the
      # user's directory on the way out; defect 3 failed by deleting a sibling checkout. The
      # property is "it failed WITHOUT WRITING ANYTHING", so every case below hashes the
      # invocation directory before and after and requires the two to match. The directory is
      # seeded with files first -- an empty directory cannot demonstrate that it survived.
      #
      # Both scripts, because their validation blocks are separate copies of the same code and
      # only one of them can be checked by looking at the other. Neither case touches the
      # network, so this costs nothing.
      - name: Control - a name that is a path, or an option, is refused and writes nothing
        run: |
          set -euo pipefail

          n=0
          expect_rejected() {
            local script=$1 label=$2
            shift 2

            n=$((n + 1))
            local inv="${RUNNER_TEMP}/neg/${n}"
            mkdir -p "${inv}/subdir"
            echo 'user data the scaffolder must not touch' > "${inv}/keepme.txt"
            echo 'nested'                                  > "${inv}/subdir/inner.txt"

            local before after rc=0
            before=$(cd "${inv}" && find . | sort | md5sum)
            # The log goes OUTSIDE the invocation directory: writing it inside would change the
            # very hash this control compares.
            ( cd "${inv}" && bash "${GITHUB_WORKSPACE}/script/${script}" "$@" ) \
              > "${inv}.log" 2>&1 || rc=$?
            after=$(cd "${inv}" && find . | sort | md5sum)

            echo "--- ${script} ${label} -> exit ${rc}"
            sed 's/^/    /' "${inv}.log"

            if [ "${rc}" -ne 2 ]; then
              echo "::error::${script} ${label}: expected exit 2, got ${rc}"; return 1
            fi
            if [ "${before}" != "${after}" ]; then
              echo "::error::${script} ${label}: the invocation directory changed"
              ( cd "${inv}" && find . | sort )
              return 1
            fi
            if [ -e "${inv}/.git" ]; then
              echo "::error::${script} ${label}: a .git appeared in the invocation directory"
              return 1
            fi
            echo "    exit 2, directory unchanged (${before%% *})"
          }

          for script in qb-new-module.sh qb-new-project.sh; do
            expect_rejected "${script}" "name '../evil'" '../evil'
            expect_rejected "${script}" "name 'a/b'"     'a/b'
            expect_rejected "${script}" "name '-x'"      '-x'
            expect_rejected "${script}" "empty name"     ''
            expect_rejected "${script}" "no argument"
          done
          echo "control: ${n} rejected invocations, every invocation directory byte-identical"

      # NEGATIVE CONTROL 2 -- a clone that fails.
      #
      # This is defect 1 replayed. Simulated by redirecting the isndev prefix at a path that is
      # not there, which fails the clone exactly where the 404 did while needing no network.
      # Three things are required of the failure: a non-zero exit, an untouched invocation
      # directory, and specifically NO `.git` in it -- that last one is the shape the original
      # `mkdir .git; mv * .git` left behind, and the reason a user lost their files.
      #
      # The redirect is per-step env rather than `git config --global`, on purpose: a global
      # redirect that outlived its step would silently turn a later REAL clone into a fake one,
      # and the step that would then pass while proving nothing is the one above.
      - name: Control - a failing clone leaves the invocation directory untouched
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "url.${{ runner.temp }}/no-such-templates/.insteadOf"
          GIT_CONFIG_VALUE_0: "https://github.com/isndev/"
        run: |
          set -euo pipefail
          git config --get-regexp '^url\.' || {
            echo "::error::the redirect is not in effect -- this control would clone for real"; exit 1; }
          [ ! -e "${RUNNER_TEMP}/no-such-templates" ] || {
            echo "::error::the 'nonexistent' template path exists"; exit 1; }

          for script in qb-new-module.sh qb-new-project.sh; do
            inv="${RUNNER_TEMP}/clonefail/${script}"
            rm -rf "${inv}"; mkdir -p "${inv}/subdir"
            echo 'user data the scaffolder must not touch' > "${inv}/keepme.txt"
            echo 'nested'                                  > "${inv}/subdir/inner.txt"

            before=$(cd "${inv}" && find . | sort | md5sum)
            rc=0
            ( cd "${inv}" && bash "${GITHUB_WORKSPACE}/script/${script}" m ) \
              > "${inv}.log" 2>&1 || rc=$?
            after=$(cd "${inv}" && find . | sort | md5sum)

            echo "--- ${script} against an unreachable template -> exit ${rc}"
            sed 's/^/    /' "${inv}.log"

            [ "${rc}" -ne 0 ] || {
              echo "::error::${script} exited 0 with the clone failing -- defect 1 is back"; exit 1; }
            [ "${before}" = "${after}" ] || {
              echo "::error::${script}: the invocation directory changed"
              ( cd "${inv}" && find . | sort ); exit 1; }
            [ ! -e "${inv}/.git" ] || {
              echo "::error::${script}: a .git appeared in the invocation directory"; exit 1; }
            [ ! -e "${inv}/m" ] || {
              echo "::error::${script}: the half-built target survived the failure"; exit 1; }
            echo "    non-zero exit, no .git, no half-built target, directory unchanged (${before%% *})"
          done
          echo "control: a failing clone destroys nothing"

      # POSITIVE CONTROL for the scripts' own anti-vacuity check.
      #
      # The check that turns defect 2's whole class loud is the `tracked -eq 0` branch at the end
      # of each script. Nothing above can reach it -- the real template is never empty -- so
      # without this step that branch could be deleted and every other leg would stay green.
      # A check that can never fire passes forever.
      #
      # Redirect the prefix at local repositories whose only commit is empty: the clone SUCCEEDS,
      # every git command succeeds, and the result has zero files. That is defect 2's end state
      # reproduced exactly, and the script must call it out instead of printing "Created".
      # `init.defaultBranch` gives these stand-ins the branch this matrix leg is testing, so the
      # control is exercised under both settings rather than one.
      - name: Control - an empty checkout is reported, not claimed as success
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "url.${{ runner.temp }}/empty-templates/.insteadOf"
          GIT_CONFIG_VALUE_0: "https://github.com/isndev/"
        run: |
          set -euo pipefail
          tpl="${RUNNER_TEMP}/empty-templates"
          rm -rf "${tpl}"; mkdir -p "${tpl}"
          for template in qb-sample-module qb-sample-project; do
            git init --quiet "${tpl}/${template}.git"
            git -C "${tpl}/${template}.git" commit --quiet --allow-empty -m 'empty template'
            files=$(git -C "${tpl}/${template}.git" ls-files | wc -l | tr -d '[:space:]')
            [ "${files}" -eq 0 ] || {
              echo "::error::the stand-in ${template} is not empty (${files} files)"; exit 1; }
            echo "stand-in ${template}.git: branch $(git -C "${tpl}/${template}.git" rev-parse --abbrev-ref HEAD), ${files} files"
          done

          for script in qb-new-module.sh qb-new-project.sh; do
            inv="${RUNNER_TEMP}/vacuity/${script}"
            rm -rf "${inv}"; mkdir -p "${inv}"
            echo 'user data the scaffolder must not touch' > "${inv}/keepme.txt"

            before=$(cd "${inv}" && find . | sort | md5sum)
            rc=0
            ( cd "${inv}" && bash "${GITHUB_WORKSPACE}/script/${script}" m ) \
              > "${inv}.log" 2>&1 || rc=$?
            after=$(cd "${inv}" && find . | sort | md5sum)

            echo "--- ${script} against an empty template -> exit ${rc}"
            sed 's/^/    /' "${inv}.log"

            [ "${rc}" -eq 1 ] || {
              echo "::error::${script}: expected exit 1 on an empty checkout, got ${rc}"; exit 1; }
            grep -q 'came out empty' "${inv}.log" || {
              echo "::error::${script}: exited 1 without reporting the empty checkout -- wrong finding"; exit 1; }
            [ "${before}" = "${after}" ] || {
              echo "::error::${script}: the invocation directory changed"
              ( cd "${inv}" && find . | sort ); exit 1; }
            [ ! -e "${inv}/m" ] || {
              echo "::error::${script}: the empty target survived"; exit 1; }
            echo "    exit 1, reported 'came out empty', directory unchanged (${before%% *})"
          done
          echo "positive control: the anti-vacuity check fires"

      # POSITIVE CONTROL for the RENDER anti-vacuity check.
      #
      # The scaffolder refuses a template that contains no @QB_...@ placeholder at all, because
      # such a template would copy cleanly, compile cleanly, and hand every user a tree named
      # after the template -- a wrong result with a zero exit, which is this lane's entire subject.
      # A real template always has placeholders, so nothing above can reach that branch, and
      # without this step it could be deleted with every other leg staying green.
      - name: Control - a template with no placeholders is refused
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "url.${{ runner.temp }}/flat-templates/.insteadOf"
          GIT_CONFIG_VALUE_0: "https://github.com/isndev/"
        run: |
          set -euo pipefail
          tpl="${RUNNER_TEMP}/flat-templates/qb-sample-module.git"
          rm -rf "${tpl}"; mkdir -p "${tpl}/template"
          echo 'cmake_minimum_required(VERSION 3.24)' > "${tpl}/template/CMakeLists.txt"
          git init --quiet "${tpl}"
          git -C "${tpl}" add -A
          git -C "${tpl}" commit --quiet -m 'template with no placeholders'
          # The stand-in must be non-empty, or this would re-run the previous control instead.
          [ "$(git -C "${tpl}" ls-files | wc -l)" -gt 0 ] || {
            echo "::error::the stand-in template is empty"; exit 1; }

          inv="${RUNNER_TEMP}/flat"; rm -rf "${inv}"; mkdir -p "${inv}"
          rc=0
          ( cd "${inv}" && bash "${GITHUB_WORKSPACE}/script/qb-new-module.sh" m ) \
            > "${inv}.log" 2>&1 || rc=$?
          sed 's/^/    /' "${inv}.log"
          [ "${rc}" -eq 1 ] || {
            echo "::error::expected exit 1 on an unrendered template, got ${rc}"; exit 1; }
          grep -q 'not personalised' "${inv}.log" || {
            echo "::error::exited 1 without reporting the missing placeholders -- wrong finding"; exit 1; }
          [ ! -e "${inv}/m" ] || { echo "::error::the unrendered target survived"; exit 1; }
          echo "positive control: an unrendered template is refused"

      # THE BUILD LEG. Everything above proves the scaffolder produced the tree it claims to have
      # produced; this proves that tree is usable. A qbm module cannot be configured standalone,
      # so the entry point is the superbuild root the template ships -- and no qb path is passed,
      # which makes this also the measurement of the "works on a machine with no qb" claim.
      - name: Build and test the scaffolded module
        if: matrix.default_branch == 'main'
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev zlib1g-dev
          cd "${RUNNER_TEMP}/scaffold-module/m"
          cmake -S .github/ci/superbuild -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel --target qbm-m-tests 2>&1 | tee "${RUNNER_TEMP}/build.log"
          tus="$(grep -c 'Building CXX object' "${RUNNER_TEMP}/build.log" || true)"
          echo "translation units compiled: ${tus}"
          [ "${tus}" -gt 0 ] || { echo "::error::0 TUs compiled; the test result below would be vacuous"; exit 1; }
          ctest --test-dir build -L 'module:qbm-m' --output-on-failure --output-junit "${RUNNER_TEMP}/results.xml"
          python3 - "${RUNNER_TEMP}/results.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          cases = list(ET.parse(sys.argv[1]).getroot().iter('testcase'))
          skipped = [c.get('name') for c in cases if c.find('skipped') is not None]
          executed = len(cases) - len(skipped)
          print(f"registered={len(cases)} executed={executed} skipped={len(skipped)}")
          bad = False
          if executed < 2: print(f"::error::{executed} tests EXECUTED, floor is 2"); bad = True
          if skipped:      print("::error::a test self-skipped; ctest reports that as a pass"); bad = True
          sys.exit(1 if bad else 0)
          PY

  project:
    # Runs ONCE, under one `init.defaultBranch`. The branch matrix and every negative control live
    # in the module job above, which exercises the SAME shared body -- the two scaffolders differ
    # only in a configuration block, and scripts/check-scaffold-consistency.sh asserts that.
    name: qb-new-project.sh
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v6

      # See the module job: `runner` is not available to `jobs.<id>.env`, so the isolated global
      # config is exported through GITHUB_ENV instead.
      - name: Git configuration under test
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL="${RUNNER_TEMP}/gitconfig"
          echo "GIT_CONFIG_GLOBAL=${GIT_CONFIG_GLOBAL}" >> "${GITHUB_ENV}"
          : > "${GIT_CONFIG_GLOBAL}"
          # One value is enough HERE only because the module job runs the same shared body under
          # both. If these two scripts ever stop sharing it, this needs the matrix too.
          git config --global init.defaultBranch main
          # A REAL USER HAS AN IDENTITY; a runner image does not. Without one the scaffolder
          # cannot make the initial commit -- it stages everything, says so loudly and still
          # exits 0, which is the right behaviour for a person but leaves this job asserting
          # `rev-list --count HEAD` against an unborn HEAD. Measured, not guessed: that is
          # exactly how this lane failed the first time it ran against the rewritten scripts.
          git config --global user.name  'scaffold ci'
          git config --global user.email 'scaffold-ci@example.invalid'
          git --version
          git config --global --list

      - name: Scaffold a project
        run: |
          set -euo pipefail
          inv="${RUNNER_TEMP}/scaffold-project"
          rm -rf "${inv}"; mkdir -p "${inv}"; cd "${inv}"

          rc=0
          bash "${GITHUB_WORKSPACE}/script/qb-new-project.sh" MyProject || rc=$?
          [ "${rc}" -eq 0 ] || { echo "::error::qb-new-project.sh exited ${rc}"; exit 1; }

          tracked=$(git -C MyProject ls-files | wc -l | tr -d '[:space:]')
          echo "tracked files: ${tracked}"
          [ "${tracked}" -gt 0 ] || {
            echo "::error::exit 0 over an empty checkout -- defect 2 is back"; exit 1; }

          worktree=$(find MyProject -mindepth 1 -maxdepth 1 -not -name .git | wc -l | tr -d '[:space:]')
          [ "${worktree}" -gt 0 ] || {
            echo "::error::'MyProject' contains nothing but .git"; exit 1; }

          remotes=$(git -C MyProject remote)
          [ -z "${remotes}" ] || {
            echo "::error::the template remote survived: ${remotes}"; exit 1; }

          commits=$(git -C MyProject rev-list --count HEAD)
          [ "${commits}" -eq 1 ] || {
            echo "::error::${commits} commits in a freshly scaffolded project; expected exactly 1"; exit 1; }

          if grep -rIl '@QB_[A-Z_]*@' MyProject --exclude-dir=.git 2>/dev/null | grep -q .; then
            echo "::error::unresolved placeholders survived rendering:"
            grep -rIl '@QB_[A-Z_]*@' MyProject --exclude-dir=.git | sed 's/^/  /'; exit 1
          fi
          grep -q 'project(MyProject' MyProject/CMakeLists.txt || {
            echo "::error::CMakeLists.txt does not name the project MyProject"; exit 1; }

          # There is no qb submodule any more, and there must not be: the generated tree resolves
          # qb through FetchContent at a ref this script wrote. A .gitmodules here would mean the
          # stored-pin design -- the one that went two majors stale -- had come back.
          [ ! -e MyProject/.gitmodules ] || {
            echo "::error::the generated project has a .gitmodules; the stored qb pin is back"; exit 1; }
          # And the ref it wrote must be a real ref on isndev/qb, or the user's first configure
          # fails on a clone. This is the version binding, measured rather than assumed.
          ref="$(sed -n 's/^set(QB_GIT_REF "\([^"]*\)".*/\1/p' MyProject/CMakeLists.txt | head -1)"
          echo "the scaffolder wrote QB_GIT_REF=${ref}"
          [ -n "${ref}" ] || { echo "::error::no QB_GIT_REF in the generated CMakeLists.txt"; exit 1; }
          git ls-remote --exit-code --heads --tags https://github.com/isndev/qb "${ref}" >/dev/null || {
            echo "::error::QB_GIT_REF='${ref}' does not exist on isndev/qb"; exit 1; }

          echo "ok: ${tracked} tracked files, ${worktree} worktree entries, 1 commit, no remote"

      # THE BUILD LEG. See the file header: this used to be omitted because the template was two
      # majors stale and would have been red from day one. It is not any more.
      - name: Build, test and run the scaffolded project
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev zlib1g-dev
          cd "${RUNNER_TEMP}/scaffold-project/MyProject"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMYPROJECT_BUILD_TESTS=ON
          cmake --build build --parallel 2>&1 | tee "${RUNNER_TEMP}/build.log"

          tus="$(grep -c 'Building CXX object' "${RUNNER_TEMP}/build.log" || true)"
          echo "translation units compiled: ${tus}"
          [ "${tus}" -gt 0 ] || { echo "::error::0 TUs compiled; everything below would be vacuous"; exit 1; }

          test -x build/bin/MyProject || { echo "::error::build/bin/MyProject was not produced"; exit 1; }
          ./build/bin/MyProject --version

          ctest --test-dir build --output-on-failure --output-junit "${RUNNER_TEMP}/results.xml"
          python3 - "${RUNNER_TEMP}/results.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          cases = list(ET.parse(sys.argv[1]).getroot().iter('testcase'))
          skipped = [c.get('name') for c in cases if c.find('skipped') is not None]
          executed = len(cases) - len(skipped)
          print(f"registered={len(cases)} executed={executed} skipped={len(skipped)}")
          bad = False
          if executed < 2: print(f"::error::{executed} tests EXECUTED, floor is 2"); bad = True
          if skipped:      print("::error::a test self-skipped; ctest reports that as a pass"); bad = True
          sys.exit(1 if bad else 0)
          PY

          # A scaffolded server that builds but does not serve is still a broken scaffold.
          ./build/bin/MyProject --port 18080 &
          server=$!
          trap 'kill "${server}" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            curl -fsS --max-time 1 http://127.0.0.1:18080/health >/dev/null 2>&1 && break
            sleep 0.2
          done
          body="$(curl -fsS --max-time 5 'http://127.0.0.1:18080/?name=ada')"
          echo "GET /?name=ada -> ${body}"
          echo "${body}" | grep -q '"message":"hello, ada"' || {
            echo "::error::the scaffolded server did not greet the caller"; exit 1; }
          echo "ok: the scaffolded project built, tested and served"
