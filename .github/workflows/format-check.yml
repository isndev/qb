name: format-check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: format-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    runs-on: ubuntu-latest
    env:
      LLVM_VERSION: "22"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Runs before the LLVM install so it reports first and needs no toolchain: it is a pure
      # Python read of the shipped headers. Scans the WHOLE tree rather than the diff -- the
      # defect it guards (a build-mode macro selecting a public type, member or alignment) can
      # be introduced by a header this PR does not touch but re-includes.
      - name: ABI - no build-mode macro may select a type, member or alignment
        run: ./scripts/check-abi-macro-split.py src

      # Same reasoning, same phase: pure Python, no toolchain, whole tree rather than the diff.
      # 3.0 retired every .tpp/.inl and made `.h` the only header extension; these two keep that
      # true. The second is the one that matters after the merge -- qb-core is ONE TU, so a
      # non-template definition in a header reached both by the archive and by a consumer TU
      # builds green here and fails at the CONSUMER's link (measured: `ld: 1 duplicate symbols`).
      # This job only covers qb; qbm's copies run from the superproject's dev/agent/verify.sh.
      - name: Headers - `.h` is the only header extension
        run: ./scripts/check-header-extensions.py

      - name: Headers - no shipped header defines a strong external symbol
        run: ./scripts/check-header-linkage.py --min-constructs 800

      # An `#include` between the braces of a namespace declares `<that-ns>::std`, and stays a
      # no-op for exactly as long as some earlier header keeps pulling the same header in first.
      # qb shipped one at io/async/tcp/connector.h:640 through 2.6.0. Same phase as the two
      # above and for the same reason: pure Python, no toolchain, whole tree rather than the
      # diff (the directive can be in a header this PR does not touch but re-includes).
      # qb only; qbm's copies run from the superproject's dev/agent/verify.sh.
      - name: 'Headers - no #include is processed inside a namespace'
        run: ./scripts/check-namespace-scoped-includes.py --min-includes 2900

      # A handler its gate cannot see is skipped with no diagnostic (Huly QB-252): a private or
      # protected on(Evt) whose class does not befriend the detector -- befriending the base that
      # dispatches is not enough -- or an on(Evt &) no gate can bind. Same phase as the three
      # above: pure Python, no toolchain, whole tree. qb only; qbm's and the examples' run from
      # the superproject's dev/agent/verify.sh.
      - name: Handlers - every gated on() is one its gate can see
        run: ./scripts/check-handler-access.py

      - name: Install LLVM tools
        run: |
          ./scripts/ci-install-linux-dependencies.sh --profile format-check
          "clang-format-${LLVM_VERSION}" --version

      # SCOPE — the WHOLE tree, since 2026-10-04 (Huly QB-10).
      #
      # This leg used to check only the files a push or a pull request changed. A whole-tree gate
      # was first rejected on data: measured at 3.0.0 over this exact scope (429 files), 56 already
      # failed — 13%, spread through real source (14 in src/qb/io, 9 in src/qb/core) — so flipping
      # then would have made the lane red on its first run. The sweep that followed reformatted
      # every one of them in a single mechanical commit, proven whitespace-only at token level, and
      # the superproject's `dev/agent/check-format.sh --census` has measured 0 non-conformant in
      # scope ever since (465 files when this was flipped). The precondition this comment used to
      # set — "land the reformat, confirm 0 fail, THEN flip to `git ls-files` and give it a floor" —
      # was met, and the flip was the maintainer's call: taken. A diff-scoped run PROVED NOTHING
      # ABOUT UNTOUCHED FILES and could pass having checked none; this one checks every file in
      # scope and refuses to pass over fewer than the floor below (a moved directory or a broken
      # glob would otherwise read as a clean tree). The floor is the qb line of the superproject's
      # `dev/agent/format-backlog.baseline`.
      #
      # The exclusion drops UPSTREAM-DERIVED trees. `src/qb/vendor/` was always excluded;
      # `not-qb/` and `src/qbm/<mod>/vendor/` were added when the sweep found qbm-http's vendored
      # llhttp inside the census. Formatting it would falsify the invariant its own header states —
      # "Vendored from llhttp 9.2.1 ... Only the symbol prefix differs; the parser is upstream's" —
      # and destroy the ability to diff against upstream. Those two alternatives are a measured
      # no-op for qb, which has neither directory; they are here so this regex and
      # `check-format.sh`'s stay byte-identical, which is what makes the local census answer the
      # same question this lane does — and the same regex runs in the format-check lanes of the
      # three qbm repositories and qb-examples.
      #
      # `src/qb/ev/` is the event loop, promoted OUT of vendor/ in 3.0 because qb maintains it and
      # publishes it as isndev/qev. It stays excluded anyway, and the reason is the same one: it is
      # a derived work of libev and of wepoll, whose retained copyright notices and per-file
      # derivation map are the licence compliance. The exclusion tracks PROVENANCE, not the name of
      # a directory. It also stays byte-identical to the standalone repo's copy — see
      # `dev/agent/check-qev-identity.py` — and a formatter that ran on one tree and not the other
      # would break that by construction.
      - name: Collect the C++ files in scope
        id: scope
        shell: bash
        env:
          SCOPE_FLOOR: "400"
        run: |
          set -euo pipefail
          git ls-files -- \
              '*.h' '*.hh' '*.hpp' '*.hxx' \
              '*.c' '*.cc' '*.cpp' '*.cxx' \
              '*.ipp' '*.tpp' |
            grep -Ev '^(build|modules|not-qb|src/qb/ev|src/qb/vendor|src/qbm/[a-z0-9_]+/vendor)/' > "${RUNNER_TEMP}/format-scope.txt" || true
          n="$(grep -c . "${RUNNER_TEMP}/format-scope.txt" || true)"
          echo "files in scope: ${n} (floor ${SCOPE_FLOOR})"
          if [ "${n}" -lt "${SCOPE_FLOOR}" ]; then
            echo "::error::only ${n} C++ files in the format-check scope, under the floor of ${SCOPE_FLOOR} -- a broken glob or a moved tree would otherwise pass as a clean census of nothing"
            exit 1
          fi

      - name: Check formatting (whole tree)
        shell: bash
        run: |
          set -euo pipefail
          : > "${RUNNER_TEMP}/format-offenders.txt"
          xargs -P "$(nproc)" -I{} sh -c \
            '"clang-format-$0" --dry-run --Werror "$1" >/dev/null 2>&1 || printf "%s\n" "$1"' \
            "${LLVM_VERSION}" {} < "${RUNNER_TEMP}/format-scope.txt" > "${RUNNER_TEMP}/format-offenders.txt"
          bad="$(grep -c . "${RUNNER_TEMP}/format-offenders.txt" || true)"
          if [ "${bad}" -ne 0 ]; then
            echo "::error::${bad} file(s) are not clang-format-${LLVM_VERSION} clean:"
            sort "${RUNNER_TEMP}/format-offenders.txt" | while IFS= read -r f; do
              echo "  ${f}"
              "clang-format-${LLVM_VERSION}" --dry-run --Werror "${f}" 2>&1 | head -20 || true
            done
            exit 1
          fi
          echo "all $(grep -c . "${RUNNER_TEMP}/format-scope.txt") files in scope are clang-format-${LLVM_VERSION} clean"
