name: format-check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: format-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    runs-on: ubuntu-latest
    env:
      LLVM_VERSION: "22"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Runs before the LLVM install so it reports first and needs no toolchain: it is a pure
      # Python read of the shipped headers. Scans the WHOLE tree rather than the diff -- the
      # defect it guards (a build-mode macro selecting a public type, member or alignment) can
      # be introduced by a header this PR does not touch but re-includes.
      - name: ABI - no build-mode macro may select a type, member or alignment
        run: ./scripts/check-abi-macro-split.py src

      # Same reasoning, same phase: pure Python, no toolchain, whole tree rather than the diff.
      # 3.0 retired every .tpp/.inl and made `.h` the only header extension; these two keep that
      # true. The second is the one that matters after the merge -- qb-core is ONE TU, so a
      # non-template definition in a header reached both by the archive and by a consumer TU
      # builds green here and fails at the CONSUMER's link (measured: `ld: 1 duplicate symbols`).
      # This job only covers qb; qbm's copies run from the superproject's dev/agent/verify.sh.
      - name: Headers - `.h` is the only header extension
        run: ./scripts/check-header-extensions.py

      - name: Headers - no shipped header defines a strong external symbol
        run: ./scripts/check-header-linkage.py --min-constructs 800

      # An `#include` between the braces of a namespace declares `<that-ns>::std`, and stays a
      # no-op for exactly as long as some earlier header keeps pulling the same header in first.
      # qb shipped one at io/async/tcp/connector.h:640 through 2.6.0. Same phase as the two
      # above and for the same reason: pure Python, no toolchain, whole tree rather than the
      # diff (the directive can be in a header this PR does not touch but re-includes).
      # qb only; qbm's copies run from the superproject's dev/agent/verify.sh.
      - name: Headers - no #include is processed inside a namespace
        run: ./scripts/check-namespace-scoped-includes.py --min-includes 2900

      - name: Install LLVM tools
        run: |
          ./scripts/ci-install-linux-dependencies.sh --profile format-check
          "clang-format-${LLVM_VERSION}" --version

      # SCOPE — clang-format is diff-scoped ON PURPOSE, and this is the measurement behind it.
      #
      # Note first what is NOT diff-scoped: the four Python guards above all sweep the whole
      # tree and carry floors. Only the clang-format leg below looks at changed files, so the
      # blast radius of this decision is formatting alone.
      #
      # A whole-tree formatting gate was considered and rejected on data. Measured at 3.0.0 with
      # the pinned clang-format 22 over this exact scope (429 files): 56 already fail — 13%,
      # spread through real source (14 in src/qb/io, 9 in src/qb/core) rather than parked in a
      # vendored corner. Switching to whole-tree would therefore make this lane red on its first
      # run, and the only way out is a 56-file mechanical reformat: a large diff that churns
      # `git blame` across the framework's hottest files and reviews as noise.
      #
      # The diff scope is the better instrument WHILE that backlog exists, because it ratchets.
      # Every file a change touches must come back clean, so the backlog can only shrink, never
      # grow, and it costs nothing to enforce. The honest caveat, which the green tick does not
      # convey on its own: THIS STEP PROVES NOTHING ABOUT UNTOUCHED FILES. A run that reports
      # success may have checked a single file, or — via the branch below — none at all.
      #
      # The sequence, if someone wants whole-tree later: land the reformat as its own commit,
      # confirm 0 of 429 fail, then flip this leg to `git ls-files` and give it a floor like the
      # guards above. Do not flip it first.
      - name: Collect changed C++ files
        id: changed
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          zero_sha="0000000000000000000000000000000000000000"
          if [ -n "${PR_BASE_SHA:-}" ]; then
            range="${PR_BASE_SHA}...${HEAD_SHA}"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "${BEFORE_SHA}" != "${zero_sha}" ]; then
            range="${BEFORE_SHA}...${HEAD_SHA}"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            range="HEAD^...HEAD"
          else
            range="HEAD"
          fi

          files="$(
            git diff --name-only --diff-filter=ACMRT "${range}" -- \
              '*.h' '*.hh' '*.hpp' '*.hxx' \
              '*.c' '*.cc' '*.cpp' '*.cxx' \
              '*.ipp' '*.tpp' |
            grep -Ev '^(build|modules|src/qb/vendor)/' || true
          )"

          {
            echo "files<<EOF"
            echo "${files}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Check formatting
        if: steps.changed.outputs.files != ''
        shell: bash
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            [ -n "${file}" ] || continue
            "clang-format-${LLVM_VERSION}" --dry-run --Werror "${file}"
          done <<< "${CHANGED_FILES}"

      - name: Nothing to check
        if: steps.changed.outputs.files == ''
        run: echo "No changed C++ files matched the format-check scope."
