name: sanitize

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanitize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitize:
    runs-on: ubuntu-latest

    env:
      LLVM_VERSION: "22"
      ASAN_OPTIONS: detect_leaks=0:strict_init_order=1:check_initialization_order=1
      UBSAN_OPTIONS: print_stacktrace=1

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          ./scripts/ci-install-linux-dependencies.sh --profile sanitize
          "clang-${LLVM_VERSION}" --version

      # The build directory is READ from the line CMake prints rather than written down here.
      # The step below needs it, and the first version of that step carried the qb-dev
      # SUPERPROJECT's layout, `build/presets/<preset>`. This repo's own presets put it at
      # ${sourceDir}/build/${presetName} (CMakePresets.json), so the step died with
      # FileNotFoundError on every run — isndev/qb 31259162131 and 31278887042 — having never
      # looked at a compile line. A guard that cannot find its subject is not a guard.
      - name: Configure
        run: |
          set -euo pipefail
          cmake --preset sanitize -G Ninja \
            -DCMAKE_C_COMPILER="clang-${LLVM_VERSION}" \
            -DCMAKE_CXX_COMPILER="clang++-${LLVM_VERSION}" \
            -DQB_CXX_STANDARD=20 \
            -DQB_BUILD_EXAMPLES=OFF \
            -DQB_USE_SYSTEM_GTEST=ON \
            -DQB_ENABLE_NATIVE_ARCH=OFF \
            -DOPENSSL_EXECUTABLE="${OPENSSL_EXECUTABLE}" 2>&1 | tee "${RUNNER_TEMP}/configure.log"
          builddir="$(sed -n 's/^-- Build files have been written to: //p' "${RUNNER_TEMP}/configure.log" | tail -1)"
          if [ -z "${builddir}" ] || [ ! -d "${builddir}" ]; then
            echo "::error::could not read the build directory out of the configure output (got '${builddir}')"
            exit 1
          fi
          echo "build directory: ${builddir}"
          echo "SANITIZE_BUILD_DIR=${builddir}" >> "${GITHUB_ENV}"

      # Direct evidence that the build is INSTRUMENTED, rather than an inference from it.
      #
      # No lane built verbosely, so `-fsanitize` had never actually been seen on a compile line
      # here: instrumentation was argued from the configure message, plus the CMake propagation
      # path, plus runtime inflation (54 s vs 22 s). That chain is strong but every link is
      # indirect, and it would survive QB_SANITIZE silently failing to reach the compiler — the
      # lane would still pass, just testing nothing. compile_commands.json holds the exact
      # command each TU is compiled with, so this reads the real thing and gates on it.
      - name: Prove the sanitizer reaches the compile line
        run: |
          set -euo pipefail
          python3 - "${SANITIZE_BUILD_DIR}" <<'PY'
          import json, os, sys
          path = os.path.join(sys.argv[1], "compile_commands.json")
          db = json.load(open(path))
          want = "-fsanitize=address,undefined"
          hits = [e for e in db if want in (e.get("command") or " ".join(e.get("arguments", [])))]
          print(f"compile database: {path}")
          print(f"compile_commands.json entries: {len(db)}")
          print(f"entries carrying {want}: {len(hits)}")
          if hits:
              cmd = hits[0].get("command") or " ".join(hits[0]["arguments"])
              print("\nfirst instrumented compile line (verbatim):\n  " + cmd)
          if len(hits) < 100:
              print(f"::error::only {len(hits)} TUs carry {want}; the sanitize lane is not "
                    f"instrumenting the build it claims to instrument.")
              sys.exit(1)
          PY

      - name: Build
        run: cmake --build --preset sanitize --parallel "$(nproc)"

      - name: Test
        run: ctest --preset sanitize
