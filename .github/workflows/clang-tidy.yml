name: clang-tidy

on:
  push:
    branches: [main, develop, c++23, experimental-c++23]
  pull_request:
    branches: [main, develop, c++23, experimental-c++23]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clang-tidy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-tidy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            clang-tidy \
            libargon2-dev \
            libssl-dev \
            ninja-build \
            pkg-config \
            zlib1g-dev
          if apt-cache show libngtcp2-crypto-ossl-dev >/dev/null 2>&1; then
            sudo apt-get install -y libngtcp2-dev libngtcp2-crypto-ossl-dev
          else
            echo "::notice::libngtcp2-crypto-ossl-dev is not available through apt on this ubuntu-latest image; using Linuxbrew libngtcp2 for QUIC auto-detection."
            if ! command -v brew >/dev/null 2>&1; then
              eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            fi
            brew install libngtcp2
            export CMAKE_PREFIX_PATH="$(brew --prefix);$(brew --prefix libngtcp2);$(brew --prefix openssl@3)"
            export PKG_CONFIG_PATH="$(brew --prefix libngtcp2)/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            export LD_LIBRARY_PATH="$(brew --prefix libngtcp2)/lib:$(brew --prefix openssl@3)/lib:${LD_LIBRARY_PATH:-}"
            echo "CMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
            echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
            echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
            pkg-config --exists libngtcp2_crypto_ossl
          fi

      - name: Collect changed translation units
        id: changed
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          zero_sha="0000000000000000000000000000000000000000"
          if [ -n "${PR_BASE_SHA:-}" ]; then
            range="${PR_BASE_SHA}...${HEAD_SHA}"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "${BEFORE_SHA}" != "${zero_sha}" ]; then
            range="${BEFORE_SHA}...${HEAD_SHA}"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            range="HEAD^...HEAD"
          else
            range="HEAD"
          fi

          files="$(
            git diff --name-only --diff-filter=ACMRT "${range}" -- \
              '*.c' '*.cc' '*.cpp' '*.cxx' |
            grep -Ev '^(build|modules)/' || true
          )"

          {
            echo "files<<EOF"
            echo "${files}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Configure compile database
        if: steps.changed.outputs.files != ''
        run: >
          cmake -S . -B build/clang-tidy -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DQB_BUILD_TESTS=ON
          -DQB_BUILD_EXAMPLES=OFF
          -DQB_ENABLE_NATIVE_ARCH=OFF

      - name: Run clang-tidy
        if: steps.changed.outputs.files != ''
        shell: bash
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            [ -n "${file}" ] || continue
            clang-tidy -p build/clang-tidy --quiet "${file}"
          done <<< "${CHANGED_FILES}"

      - name: Nothing to check
        if: steps.changed.outputs.files == ''
        run: echo "No changed C++ translation units matched the clang-tidy scope."
