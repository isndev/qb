# Documentation anti-drift guard.
# Runs scripts/doc-lint.sh: forbidden retired tokens, broken internal links,
# missing governance files. See CONTRIBUTING.md.
name: doc-lint

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'README.md'
      - 'readme/**'
      - 'INSTALL.md'
      - 'VERSIONING.md'
      - 'CHANGELOG.md'
      - 'SECURITY.md'
      - 'SUPPORT.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'scripts/doc-lint.sh'
      # The agent-facing llm/ docs moved into this repo, and scripts/llm-guard.py (driven
      # from doc-lint.sh section 1c) is the only guard that reads them in a STANDALONE
      # checkout -- the superproject that used to hold them is private, so without these
      # filters a commit touching llm/ would reach this repo's default branch unchecked.
      # The two baselines are listed for the same reason the script is: an edit to either
      # changes what the gate accepts.
      - 'llm/**'
      - 'scripts/llm-guard.py'
      - 'scripts/llm-guard.baseline'
      - 'scripts/llm-cite-digest.baseline'
      # `/llms.txt` + `/llms-full.txt` are the published agent index; doc-lint.sh section 1d
      # regenerates them and fails on any difference. Both the generated files and the
      # generator are listed so a hand edit to either is caught, and README.md is already
      # above -- its "For AI assistants" section is what points a user at them.
      - 'llms.txt'
      - 'llms-full.txt'
      - 'scripts/gen-llms-txt.py'
      # cite-check.py (driven from doc-lint.sh:93 -- this workflow is its only CI
      # caller) validates every `src:` citation against the SOURCE it names, so a
      # source-only commit -- a rename, a deletion, an insert that shifts line numbers --
      # can invalidate hundreds of citations. Without these the guard never fires on it.
      # The three qbm modules got 'src/**' during their move-prep; qb was left behind,
      # in the one repo where 470 files moved. Measured over README.md + readme/**,
      # replicating cite-check.py's own tokenizer: src/ 209 citation tokens,
      # tests/ 44, cmake/ 22, CMakePresets.json 2, CMakeLists.txt 1, script/ 1 --
      # every one of them in-project and range-checked, none of them covered before.
      - 'src/**'
      - 'tests/**'
      # Was just 'cmake/qbConfig.cmake' (the lint reads the expected Verified-against
      # version from it, so a version-only bump must trigger it -- that is exactly the
      # change that silently invalidated 129 markers before). Widened to the directory:
      # citations also target qbCompiler.cmake, qbDependencies.cmake, qbFunctions.cmake
      # and CodeCoverage.cmake, 12 tokens that sat behind an uncovered path.
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'script/**'
      # Deliberately NOT 'examples/**': the 112 examples/ citation tokens name the
      # SIBLING examples submodule, so qb has no examples/ of its own for a filter to
      # match, and resolve_in_project() SKIPs them (cite-check.py:69). Adding it would
      # guard nothing. Those 112 are validated by no repo -- tracked separately.
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'README.md'
      - 'readme/**'
      - 'INSTALL.md'
      - 'VERSIONING.md'
      - 'CHANGELOG.md'
      - 'SECURITY.md'
      - 'SUPPORT.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'scripts/doc-lint.sh'
      # The agent-facing llm/ docs moved into this repo, and scripts/llm-guard.py (driven
      # from doc-lint.sh section 1c) is the only guard that reads them in a STANDALONE
      # checkout -- the superproject that used to hold them is private, so without these
      # filters a commit touching llm/ would reach this repo's default branch unchecked.
      # The two baselines are listed for the same reason the script is: an edit to either
      # changes what the gate accepts.
      - 'llm/**'
      - 'scripts/llm-guard.py'
      - 'scripts/llm-guard.baseline'
      - 'scripts/llm-cite-digest.baseline'
      # `/llms.txt` + `/llms-full.txt` are the published agent index; doc-lint.sh section 1d
      # regenerates them and fails on any difference. Both the generated files and the
      # generator are listed so a hand edit to either is caught, and README.md is already
      # above -- its "For AI assistants" section is what points a user at them.
      - 'llms.txt'
      - 'llms-full.txt'
      - 'scripts/gen-llms-txt.py'
      # cite-check.py (driven from doc-lint.sh:93 -- this workflow is its only CI
      # caller) validates every `src:` citation against the SOURCE it names, so a
      # source-only commit -- a rename, a deletion, an insert that shifts line numbers --
      # can invalidate hundreds of citations. Without these the guard never fires on it.
      # The three qbm modules got 'src/**' during their move-prep; qb was left behind,
      # in the one repo where 470 files moved. Measured over README.md + readme/**,
      # replicating cite-check.py's own tokenizer: src/ 209 citation tokens,
      # tests/ 44, cmake/ 22, CMakePresets.json 2, CMakeLists.txt 1, script/ 1 --
      # every one of them in-project and range-checked, none of them covered before.
      - 'src/**'
      - 'tests/**'
      # Was just 'cmake/qbConfig.cmake' (the lint reads the expected Verified-against
      # version from it, so a version-only bump must trigger it -- that is exactly the
      # change that silently invalidated 129 markers before). Widened to the directory:
      # citations also target qbCompiler.cmake, qbDependencies.cmake, qbFunctions.cmake
      # and CodeCoverage.cmake, 12 tokens that sat behind an uncovered path.
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'script/**'
      # Deliberately NOT 'examples/**': the 112 examples/ citation tokens name the
      # SIBLING examples submodule, so qb has no examples/ of its own for a filter to
      # match, and resolve_in_project() SKIPs them (cite-check.py:69). Adding it would
      # guard nothing. Those 112 are validated by no repo -- tracked separately.


# Least privilege. Nothing in this workflow writes to the repository, so nothing
# in it needs a token that can.
permissions:
  contents: read

concurrency:
  group: doc-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doc-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run documentation anti-drift guard
        run: ./scripts/doc-lint.sh
