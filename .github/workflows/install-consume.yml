# Proves the two INTEGRATION modes qb documents actually work.
#
# Neither was covered by any job before this one, which is why they rotted unnoticed: a CMake audit
# found find_package(qb) broken after install, and no build had ever tried it. A framework whose
# README shows `find_package(qb)` must fail its own CI when that stops working.
name: install-consume

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: install-consume-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-and-consume:
    name: install + find_package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: ./scripts/ci-install-linux-dependencies.sh --profile build

      # ── Mode 1: install, then find_package(qb) from a separate project ──────
      - name: Build and install qb
        run: |
          cmake -S . -B build-install -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/_prefix" \
            -DQB_BUILD_TESTS=OFF -DQB_BUILD_EXAMPLES=OFF
          cmake --build build-install --parallel
          cmake --install build-install

      # qb owns every top-level name it installs. Anything else is a header that can shadow, or be
      # shadowed by, one the consumer already has -- which is how ev.h / event.h / uuid.h and a
      # second copy of nlohmann/json.hpp used to land in every consumer's include root.
      # `nlohmann` is expected ONLY when qb fell back to its bundled copy (no system
      # nlohmann_json on the runner). `qb/` is the only name qb itself publishes: the legacy
      # `cube.h` umbrella (guard QB_QB_H, just actor.h + io.h + main.h) was the last generic
      # top-level name and was removed -- nothing in the tree ever included it.
      - name: Installed include root is qb-owned
        run: |
          actual="$(ls _prefix/include | sort | tr '\n' ' ')"
          echo "include root: ${actual}"
          case "${actual}" in
            "nlohmann qb "|"qb ") ;;
            *) echo "::error::unexpected top-level names in the installed include root: ${actual}"
               exit 1 ;;
          esac

      - name: Consume via find_package(qb)
        run: |
          mkdir -p _consumer && cd _consumer
          cat > CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.24)
          project(qb_find_package_consumer LANGUAGES CXX)
          find_package(qb CONFIG REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE qb::core)
          # NEGATIVE CONTROL: the consumer's own headers must win the include race, and none of
          # them may be reachable from qb's public headers. A plain -I outranks the -isystem an
          # imported target arrives on, so if qb still published any of these names, the #error
          # inside the decoy fires and this job fails.
          target_include_directories(consumer BEFORE PRIVATE "${CMAKE_CURRENT_SOURCE_DIR}/decoy")
          EOF
          # The qev/ + qev*.h rows are the live ones (the fork's names since 3.0.0). The ev/ + ev*.h
          # rows are kept on purpose: they are the names qb used to publish, and the decoy is the
          # only thing that would notice them coming back.
          mkdir -p decoy/ev decoy/qev decoy/uuid/include decoy/nanolog decoy/ska_hash
          for f in qev.h qev++.h qev_config.h qev_vars.h qev_wrap.h \
                   qev/qev.h qev/qev++.h qev/event.h qev/event_compat.h \
                   ev.h ev++.h event.h event_compat.h ev_config.h ev_vars.h ev_wrap.h uuid.h \
                   ev/ev.h ev/ev++.h ev/event.h ev/event_compat.h \
                   uuid/uuid.h uuid/include/uuid.h nanolog/nanolog.h \
                   ska_hash/unordered_map.hpp ska_hash/flat_hash_map.hpp; do
            echo "#error \"a consumer-owned ${f} was picked up instead of qb's vendored header\"" > "decoy/${f}"
          done
          # Reaches every vendored fork through qb's public API: qev (base.h), stduuid (uuid.h),
          # nanolog (io.h), ska_hash (unordered_map.h) and nlohmann (json.h). The original TU
          # included only actor.h + main.h and touched none of them.
          cat > main.cpp <<'EOF'
          #include <qb/actor.h>
          #include <qb/main.h>
          #include <qb/io.h>
          #include <qb/io/async/event/base.h>
          #include <qb/uuid.h>
          #include <qb/json.h>
          #include <qb/system/container/unordered_map.h>
          #include <qb/system/container/unordered_set.h>
          #include <atomic>
          #include <cstddef>
          #include <cstdint>
          #include <cstdio>
          #include <cstring>
          // The compiled libqev was built with EV_MULTIPLICITY=1. If the generated config header
          // does not reach this TU, qev.h silently defaults it to 4 and every qev_* prototype
          // disagrees with libqev.a. qb's headers #error on it; assert here too.
          static_assert(EV_MULTIPLICITY == 1, "qev config header did not reach the consumer");
          // Cross-core delivery across the ABI boundary. Events are memcpy-relocated between
          // cores, so if the consumer's view of the qb::Event header disagrees with the one
          // libqb-core was compiled with, `dest` is read out of the payload and delivery
          // silently stops -- no crash, no diagnostic, same sizeof(qb::Event). That is exactly
          // what NDEBUG-dependent public types used to cause, twice, and neither was visible to
          // a job that built the consumer with the same build type as the library.
          static constexpr int kMessages = 10;
          static std::atomic<int> g_received{0};
          struct Ping : qb::Event { std::uint32_t seq; explicit Ping(std::uint32_t s) : seq(s) {} };
          class Receiver : public qb::Actor {
          public:
            qb::io::async::task<bool> onInit() override { registerEvent<Ping>(*this); co_return true; }
            void on(const Ping &e) {
              if (e.seq < (std::uint32_t) kMessages) g_received.fetch_add(1, std::memory_order_relaxed);
              if (e.seq + 1 == (std::uint32_t) kMessages) broadcast<qb::KillEvent>();
            }
          };
          class Sender : public qb::Actor {
            qb::ActorId _peer;
          public:
            explicit Sender(qb::ActorId peer) : _peer(peer) {}
            qb::io::async::task<bool> onInit() override {
              for (int i = 0; i < kMessages; ++i) push<Ping>(_peer, (std::uint32_t) i);
              co_return true;
            }
          };
          // The header offsets a mismatched consumer got wrong, read back through the PUBLIC
          // accessors out of a known byte pattern -- the same thing the transport does.
          static int abi_probe() {
            struct Probe : qb::Event { std::uint32_t payload; };
            Probe probe{}; unsigned char wire[sizeof(Probe)];
            for (std::size_t i = 0; i < sizeof(wire); ++i) wire[i] = (unsigned char) i;
            std::memcpy((void *) &probe, wire, sizeof(Probe));
            std::uint32_t dest{}, src{}, first{}; std::uint16_t id{};
            std::memcpy(&dest, wire + 8, 4); std::memcpy(&src, wire + 12, 4);
            std::memcpy(&first, wire + 16, 4); std::memcpy(&id, wire + 6, 2);
            const bool ok = (std::uint32_t) probe.getDestination() == dest
                         && (std::uint32_t) probe.getSource() == src
                         && (std::uint32_t) probe.getID() == id
                         && probe.payload == first;
            std::printf("abi: sizeof(Event)=%zu sizeof(id_type)=%zu %s\n",
                        sizeof(qb::Event), sizeof(qb::Event::id_type), ok ? "OK" : "MISMATCH");
            return ok ? 0 : 1;
          }
          int main() {
            qb::unordered_map<int, int> um; um[1] = 2;
            qb::unordered_set<int> us; us.insert(3);
            auto id = qb::generate_random_uuid();
            qb::json j; j["k"] = 42;
            std::printf("ev=%d.%d map=%d set=%d uuid=%zu json=%d\n",
                        qev_version_major(), qev_version_minor(), um[1], (int) us.count(3),
                        uuids::to_string(id).size(), (int) j["k"]);
            const int abi = abi_probe();
            qb::Main engine;
            auto rid = engine.addActor<Receiver>(1);
            engine.addActor<Sender>(0, rid);
            engine.start(); engine.join();
            const int got = g_received.load(std::memory_order_relaxed);
            std::printf("cross-core delivery: %d/%d  event=%s\n", got, kMessages,
                        qb::event_type_name(qb::Event::type_to_id<Ping>()));
            if (abi != 0 || got != kMessages) { std::printf("FAIL\n"); return 1; }
            std::printf("PASS\n");
            return 0;
          }
          EOF
          # THE point of the matrix: one installed (Release) qb, three consumer build types.
          # `unset` is CMake's DEFAULT and defines no NDEBUG -- it is the configuration the
          # single Release-consumer version of this job could never have exercised, and the one
          # that caught the qb::unordered_map layout split.
          for bt in Release Debug unset; do
            echo "::group::consumer CMAKE_BUILD_TYPE=${bt}"
            args=""
            [ "${bt}" = "unset" ] || args="-DCMAKE_BUILD_TYPE=${bt}"
            rm -rf "b-${bt}"
            # shellcheck disable=SC2086
            cmake -S . -B "b-${bt}" -G Ninja ${args} \
              -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/_prefix"
            cmake --build "b-${bt}" --parallel
            "./b-${bt}/consumer" || { echo "::error::consumer failed with CMAKE_BUILD_TYPE=${bt} against a Release-installed qb"; exit 1; }
            echo "::endgroup::"
          done

      # ── Mode 2: FetchContent, and the standard used to compile the CONSUMER ──
      # Regression guard for isndev/qb#9: embedding qb must not drag the parent's
      # own sources down to qb's language level, nor pick its build type.
      - name: Consume via FetchContent, parent standard preserved
        run: |
          mkdir -p _fetch && cd _fetch
          cat > CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.24)
          project(qb_fetchcontent_consumer LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 23)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          include(FetchContent)
          FetchContent_Declare(qb SOURCE_DIR "$ENV{GITHUB_WORKSPACE}")
          FetchContent_MakeAvailable(qb)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE qb::core)
          if(NOT CMAKE_CXX_STANDARD STREQUAL "23")
            message(FATAL_ERROR "qb overwrote the parent's CMAKE_CXX_STANDARD (got ${CMAKE_CXX_STANDARD}, expected 23)")
          endif()
          if(NOT CMAKE_BUILD_TYPE STREQUAL "")
            message(FATAL_ERROR "qb forced CMAKE_BUILD_TYPE on its parent (got ${CMAKE_BUILD_TYPE})")
          endif()
          if(TARGET gtest)
            message(FATAL_ERROR "embedding qb pulled googletest: QB_BUILD_TESTS must default OFF when embedded")
          endif()
          EOF
          cat > main.cpp <<'EOF'
          #include <qb/actor.h>
          #include <qb/main.h>
          int main() { qb::Main main; main.core(0); return 0; }
          EOF
          cmake -S . -B b -G Ninja
          cmake --build b --parallel
          ./b/consumer
