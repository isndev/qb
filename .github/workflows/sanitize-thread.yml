name: sanitize-thread

on:
  push:
    branches:
      - 'c\+\+23'
  pull_request:
    branches:
      - 'c\+\+23'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanitize-thread-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitize-thread:
    runs-on: ubuntu-latest

    env:
      LLVM_VERSION: "22"
      TSAN_OPTIONS: second_deadlock_stack=1

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates \
            gnupg \
            libargon2-dev \
            libssl-dev \
            ninja-build \
            openssl \
            pkg-config \
            wget \
            zlib1g-dev
          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "${LLVM_VERSION}"
          sudo apt-get install -y "clang-${LLVM_VERSION}"
          sudo apt-get install -y libngtcp2-dev libngtcp2-crypto-ossl-dev
          export OPENSSL_EXECUTABLE="$(command -v openssl)"
          echo "OPENSSL_EXECUTABLE=${OPENSSL_EXECUTABLE}" >> "$GITHUB_ENV"
          "clang-${LLVM_VERSION}" --version

      - name: Configure
        run: >
          cmake --preset sanitize-thread -G Ninja
          -DCMAKE_C_COMPILER=clang-${LLVM_VERSION}
          -DCMAKE_CXX_COMPILER=clang++-${LLVM_VERSION}
          -DQB_CXX_STANDARD=20
          -DQB_BUILD_EXAMPLES=OFF
          -DQB_ENABLE_NATIVE_ARCH=OFF
          -DOPENSSL_EXECUTABLE="${OPENSSL_EXECUTABLE}"

      - name: Build
        run: cmake --build --preset sanitize-thread --parallel "$(nproc)"

      - name: Test
        run: ctest --preset sanitize-thread
