name: sanitize-thread

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanitize-thread-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitize-thread:
    runs-on: ubuntu-latest

    env:
      LLVM_VERSION: "22"
      TSAN_OPTIONS: second_deadlock_stack=1

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          ./scripts/ci-install-linux-dependencies.sh --profile sanitize-thread
          "clang-${LLVM_VERSION}" --version

      # The build directory is READ from the line CMake prints — see the same step in
      # sanitize.yml for the failure that taught this: a hard-coded `build/presets/<preset>`
      # is the qb-dev superproject's layout, not this repo's.
      - name: Configure
        run: |
          set -euo pipefail
          cmake --preset sanitize-thread -G Ninja \
            -DCMAKE_C_COMPILER="clang-${LLVM_VERSION}" \
            -DCMAKE_CXX_COMPILER="clang++-${LLVM_VERSION}" \
            -DQB_CXX_STANDARD=20 \
            -DQB_BUILD_EXAMPLES=OFF \
            -DQB_USE_SYSTEM_GTEST=ON \
            -DQB_ENABLE_NATIVE_ARCH=OFF \
            -DOPENSSL_EXECUTABLE="${OPENSSL_EXECUTABLE}" 2>&1 | tee "${RUNNER_TEMP}/configure.log"
          builddir="$(sed -n 's/^-- Build files have been written to: //p' "${RUNNER_TEMP}/configure.log" | tail -1)"
          if [ -z "${builddir}" ] || [ ! -d "${builddir}" ]; then
            echo "::error::could not read the build directory out of the configure output (got '${builddir}')"
            exit 1
          fi
          echo "build directory: ${builddir}"
          echo "SANITIZE_BUILD_DIR=${builddir}" >> "${GITHUB_ENV}"

      # Direct evidence that the build is INSTRUMENTED — see the same step in sanitize.yml for
      # why an inference from the configure message and runtime inflation was not enough.
      - name: Prove the sanitizer reaches the compile line
        run: |
          set -euo pipefail
          python3 - "${SANITIZE_BUILD_DIR}" <<'PY'
          import json, os, sys
          path = os.path.join(sys.argv[1], "compile_commands.json")
          db = json.load(open(path))
          want = "-fsanitize=thread"
          hits = [e for e in db if want in (e.get("command") or " ".join(e.get("arguments", [])))]
          print(f"compile database: {path}")
          print(f"compile_commands.json entries: {len(db)}")
          print(f"entries carrying {want}: {len(hits)}")
          if hits:
              cmd = hits[0].get("command") or " ".join(hits[0]["arguments"])
              print("\nfirst instrumented compile line (verbatim):\n  " + cmd)
          if len(hits) < 100:
              print(f"::error::only {len(hits)} TUs carry {want}; the sanitize-thread lane is "
                    f"not instrumenting the build it claims to instrument.")
              sys.exit(1)
          PY

      - name: Build
        run: cmake --build --preset sanitize-thread --parallel "$(nproc)"

      - name: Test
        run: ctest --preset sanitize-thread
