name: cmake

on:
  push:
    branches:
      - 'c\+\+23'
  pull_request:
    branches:
      - 'c\+\+23'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-gcc-release
            os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release

          - name: ubuntu-clang-release
            os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release

          - name: macos-clang-release
            os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release

          - name: windows-msvc-release
            os: windows-latest
            build_type: Release

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            libargon2-dev \
            libssl-dev \
            ninja-build \
            pkg-config \
            zlib1g-dev
          if apt-cache show libngtcp2-crypto-ossl-dev >/dev/null 2>&1; then
            sudo apt-get install -y libngtcp2-dev libngtcp2-crypto-ossl-dev
          else
            echo "::notice::libngtcp2-crypto-ossl-dev is not available through apt on this ubuntu-latest image; using Linuxbrew libngtcp2 for QUIC auto-detection."
            if ! command -v brew >/dev/null 2>&1; then
              eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            fi
            brew install libngtcp2
            export CMAKE_PREFIX_PATH="$(brew --prefix);$(brew --prefix libngtcp2);$(brew --prefix openssl@3)"
            export PKG_CONFIG_PATH="$(brew --prefix libngtcp2)/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            export LD_LIBRARY_PATH="$(brew --prefix libngtcp2)/lib:$(brew --prefix openssl@3)/lib:${LD_LIBRARY_PATH:-}"
            echo "CMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
            echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
            echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
            pkg-config --exists libngtcp2_crypto_ossl
          fi

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install argon2 libngtcp2 ninja openssl@3 zlib
          echo "CMAKE_PREFIX_PATH=$(brew --prefix);$(brew --prefix libngtcp2);$(brew --prefix openssl@3);$(brew --prefix zlib)" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix libngtcp2)/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows argon2:x64-windows "ngtcp2[openssl]:x64-windows" zlib:x64-windows
          echo "VCPKG_TOOLCHAIN=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV

      - name: Set build parameters
        id: build
        shell: bash
        run: |
          echo "dir=${{ github.workspace }}/build/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "jobs=${NUMBER_OF_PROCESSORS}" >> "$GITHUB_OUTPUT"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            echo "jobs=$(sysctl -n hw.logicalcpu)" >> "$GITHUB_OUTPUT"
          else
            echo "jobs=$(nproc)" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure
        shell: bash
        run: |
          args=(
            -S "${{ github.workspace }}"
            -B "${{ steps.build.outputs.dir }}"
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
            -DQB_BUILD_TESTS=ON
            -DQB_BUILD_EXAMPLES=ON
            -DQB_BUILD_BENCHMARKS=ON
            -DQB_ENABLE_NATIVE_ARCH=OFF
          )

          if [ "$RUNNER_OS" != "Windows" ]; then
            args+=(
              -G Ninja
              -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
              -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
            )
          fi

          if [ -n "${VCPKG_TOOLCHAIN:-}" ]; then
            args+=(
              -DCMAKE_TOOLCHAIN_FILE="${VCPKG_TOOLCHAIN}"
              -DVCPKG_TARGET_TRIPLET=x64-windows
            )
          fi

          cmake "${args[@]}"

      - name: Build
        run: >
          cmake --build "${{ steps.build.outputs.dir }}"
          --config ${{ matrix.build_type }}
          --parallel ${{ steps.build.outputs.jobs }}

      - name: Test
        working-directory: ${{ steps.build.outputs.dir }}
        run: ctest --build-config ${{ matrix.build_type }} --output-on-failure --parallel 4
