name: cmake

on:
  push:
    branches:
      - 'c\+\+23'
  pull_request:
    branches:
      - 'c\+\+23'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      LLVM_VERSION: "22"

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-gcc-cxx20-release
            os: ubuntu-latest
            c_compiler: gcc-14
            cpp_compiler: g++-14
            build_type: Release
            cxx_standard: 20

          - name: ubuntu-clang-cxx20-release
            os: ubuntu-latest
            c_compiler: clang-22
            cpp_compiler: clang++-22
            build_type: Release
            cxx_standard: 20

          - name: macos-clang-cxx20-release
            os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release
            cxx_standard: 20

          - name: windows-msvc-cxx20-release
            os: windows-latest
            build_type: Release
            cxx_standard: 20

          - name: ubuntu-clang-cxx23-release
            os: ubuntu-latest
            c_compiler: clang-22
            cpp_compiler: clang++-22
            build_type: Release
            cxx_standard: 23

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates \
            g++-14 \
            gcc-14 \
            gnupg \
            libargon2-dev \
            libssl-dev \
            ninja-build \
            openssl \
            pkg-config \
            wget \
            zlib1g-dev
          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "${LLVM_VERSION}"
          sudo apt-get install -y "clang-${LLVM_VERSION}"
          sudo apt-get install -y libngtcp2-dev libngtcp2-crypto-ossl-dev
          export OPENSSL_EXECUTABLE="$(command -v openssl)"
          echo "OPENSSL_EXECUTABLE=${OPENSSL_EXECUTABLE}" >> "$GITHUB_ENV"
          gcc-14 --version
          "clang-${LLVM_VERSION}" --version

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install argon2 libngtcp2 ninja openssl@3 zlib
          echo "CMAKE_PREFIX_PATH=$(brew --prefix);$(brew --prefix libngtcp2);$(brew --prefix openssl@3);$(brew --prefix zlib)" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix libngtcp2)/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
          echo "OPENSSL_EXECUTABLE=$(brew --prefix openssl@3)/bin/openssl" >> "$GITHUB_ENV"

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows argon2:x64-windows "ngtcp2[openssl]:x64-windows" zlib:x64-windows
          echo "VCPKG_TOOLCHAIN=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV

      - name: Set build parameters
        id: build
        shell: bash
        run: |
          echo "dir=${{ github.workspace }}/build/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "jobs=${NUMBER_OF_PROCESSORS}" >> "$GITHUB_OUTPUT"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            echo "jobs=$(sysctl -n hw.logicalcpu)" >> "$GITHUB_OUTPUT"
          else
            echo "jobs=$(nproc)" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure
        shell: bash
        run: |
          args=(
            -S "${{ github.workspace }}"
            -B "${{ steps.build.outputs.dir }}"
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
            -DQB_CXX_STANDARD=${{ matrix.cxx_standard }}
            -DQB_BUILD_TESTS=ON
            -DQB_BUILD_EXAMPLES=ON
            -DQB_BUILD_BENCHMARKS=ON
            -DQB_ENABLE_NATIVE_ARCH=OFF
          )

          if [ "$RUNNER_OS" != "Windows" ]; then
            args+=(
              -G Ninja
              -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
              -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
            )
          fi

          if [ -n "${VCPKG_TOOLCHAIN:-}" ]; then
            args+=(
              -DCMAKE_TOOLCHAIN_FILE="${VCPKG_TOOLCHAIN}"
              -DVCPKG_TARGET_TRIPLET=x64-windows
            )
          fi

          if [ -n "${OPENSSL_EXECUTABLE:-}" ]; then
            args+=(-DOPENSSL_EXECUTABLE="${OPENSSL_EXECUTABLE}")
          fi

          cmake "${args[@]}"

      - name: Build
        run: >
          cmake --build "${{ steps.build.outputs.dir }}"
          --config ${{ matrix.build_type }}
          --parallel ${{ steps.build.outputs.jobs }}

      - name: Test
        working-directory: ${{ steps.build.outputs.dir }}
        run: ctest --build-config ${{ matrix.build_type }} --output-on-failure --parallel 4
