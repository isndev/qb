name: cmake

# SCRATCH, never to merge (Huly QB-1270 part 4): this branch replaces qb's cmake workflow with ONE job on the
# macOS image the lane runs, which measures qb's "a TLS read that must write first" witness with OpenSSL 4.1 and 3.5:
# diag/macos-oracle.sh: the system, then qb built against openssl@4 and against openssl@3: the tree as committed (the
# candidate), and its tests over the base's src/ (the red run); diag/macos-mutants.py: the lot's plants, one at a time.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "suite (the candidate's every test, both builds), witness (the witness targets alone) or mutants"
        required: false
        default: suite
      base:
        description: "the commit whose src/ the red run builds (empty: no red run)"
        required: false
        default: e433647f2dbeaa159d6e62ab0a6d637d651f2db4
      ids:
        description: "the plants the mutants scope runs (empty: every one)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: cmake-${{ github.ref }}-${{ inputs.scope }}
  cancel-in-progress: true

jobs:
  macos-oracle:
    name: macos-tls-oracle
    runs-on: macos-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install dependencies as the lane does, and openssl@3 beside it
        run: |
          ./scripts/ci-install-macos-dependencies.sh --profile build
          brew install openssl@3 openssl@4
          brew list --versions openssl@3 openssl@4 libngtcp2

      - name: The oracle
        if: inputs.scope != 'mutants'
        run: bash diag/macos-oracle.sh "${{ runner.temp }}/oracle" "${{ inputs.scope || 'suite' }}" "${{ inputs.base }}"

      - name: The mutants (openssl@4)
        if: inputs.scope == 'mutants'
        run: |
          p="$(brew --prefix openssl@4)"
          mkdir -p "${{ runner.temp }}/oracle"
          env -u CMAKE_PREFIX_PATH -u PKG_CONFIG_PATH -u OPENSSL_EXECUTABLE PKG_CONFIG_PATH="$p/lib/pkgconfig" \
            cmake -S . -B build-mutants -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang \
              -DCMAKE_CXX_COMPILER=clang++ -DQB_CXX_STANDARD=20 -DQB_BUILD_TESTS=ON -DQB_BUILD_EXAMPLES=OFF \
              -DQB_BUILD_BENCHMARKS=OFF -DQB_USE_SYSTEM_GTEST=ON -DQB_WITH_SSL=ON -DQB_REQUIRE_FEATURES=ON \
              -DQB_WITH_QUIC=OFF -DQB_ENABLE_NATIVE_ARCH=OFF -DOPENSSL_ROOT_DIR="$p" -DOPENSSL_EXECUTABLE="$p/bin/openssl" \
              -DCMAKE_PREFIX_PATH="$p;$(brew --prefix);$(brew --prefix zlib)" > "${{ runner.temp }}/oracle/mutants-configure.log" 2>&1
          grep 'Found OpenSSL' "${{ runner.temp }}/oracle/mutants-configure.log"
          JOBS="$(sysctl -n hw.logicalcpu)" python3 diag/macos-mutants.py . build-mutants "${{ runner.temp }}/oracle/mutants" ${{ inputs.ids }} \
            | tee "${{ runner.temp }}/oracle/mutants.txt"

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos-tls-oracle-${{ github.run_id }}
          path: ${{ runner.temp }}/oracle
          retention-days: 14
