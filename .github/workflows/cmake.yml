name: cmake

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      LLVM_VERSION: ${{ matrix.llvm_version || '22' }}
      # Three daemon-free OpenSSL binaries, registered only with QB_HAS_SSL. They are already
      # part of the full suite below; this list adds assertions, not another test run.
      QB_SSL_CTESTS: >-
        qb-io-test-unit-ssl-context-config
        qb-io-test-unit-ssl-context-value
        qb-io-test-unit-ssl-context-guards

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-gcc-cxx20-release
            os: ubuntu-latest
            c_compiler: gcc-14
            cpp_compiler: g++-14
            build_type: Release
            cxx_standard: 20

          - name: ubuntu-clang-cxx20-release
            os: ubuntu-latest
            c_compiler: clang-22
            cpp_compiler: clang++-22
            build_type: Release
            cxx_standard: 20

          - name: macos-clang-cxx20-release
            os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release
            cxx_standard: 20

          # windows-msvc-cxx20-release — DISABLED, verified out of band instead.
          #
          # Not dropped because MSVC is unsupported: it is supported, and the maintainer validates
          # the full dev solution on a Windows/MSVC machine before each release. Disabled because
          # the hosted runner is a poor instrument for it — the job took ~70 minutes and its tests
          # time out under that load, so it reported build-infrastructure noise rather than defects
          # in this codebase. The two real problems it did surface are FIXED (vcpkg applocal racing
          # this project's own DLL deployment; `/GL` on ~200 test binaries forcing 211 LTCG link
          # restarts) — the remaining cost is the runner, not the code.
          #
          # MSVC-specific correctness is still enforced at compile time for everyone: the warning
          # set in cmake/qbCompiler.cmake is deliberately aligned with the GCC/clang policy, so a
          # local MSVC build fails on the same rules CI enforces here.
          #
          # Re-enable by uncommenting. Worth doing once the CI has a vcpkg binary cache, which is
          # what makes this job affordable — right now every run rebuilds all dependencies.
          # - name: windows-msvc-cxx20-release
          #   os: windows-latest
          #   build_type: Release
          #   cxx_standard: 20

          - name: ubuntu-clang-cxx23-release
            os: ubuntu-latest
            c_compiler: clang-22
            cpp_compiler: clang++-22
            build_type: Release
            cxx_standard: 23

          # The oldest clang still common on developer machines (Debian 13's default, apt.llvm.org on
          # Ubuntu 24.04). Every clang before 22 lays a never-written by-value coroutine parameter out
          # at the wrong alignment on x86-64 (LLVM issue 159571, Huly QB-213): two system tests SIGSEGV
          # at -O3 without qb::io::async::pin_frame_copy, and this lane is what keeps that shield honest.
          - name: ubuntu-clang19-cxx20-release
            os: ubuntu-latest
            c_compiler: clang-19
            cpp_compiler: clang++-19
            llvm_version: "19"
            build_type: Release
            cxx_standard: 20

          # Linux arm64, native (Huly QB-249). Until 2026-10-03 the development superproject's lanes
          # ran on an arm64 guest and were this project's only Linux arm64 coverage; they moved to
          # x86-64 runners that day, so the row lives here now, on GitHub's hosted arm64 image. Same
          # toolchain and the same per-backend event-loop matrix as the x86-64 gcc row: the arm64
          # memory model is weaker, and the cross-core paths are where that shows.
          - name: ubuntu-arm64-gcc-cxx20-release
            os: ubuntu-24.04-arm
            c_compiler: gcc-14
            cpp_compiler: g++-14
            build_type: Release
            cxx_standard: 20

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          ./scripts/ci-install-linux-dependencies.sh --profile build
          gcc-14 --version
          "clang-${LLVM_VERSION}" --version

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          ./scripts/ci-install-macos-dependencies.sh --profile build

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/ci-install-windows-dependencies.ps1 -Profile build

      - name: Set build parameters
        id: build
        shell: bash
        run: |
          echo "dir=${{ github.workspace }}/build/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "jobs=${NUMBER_OF_PROCESSORS}" >> "$GITHUB_OUTPUT"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            echo "jobs=$(sysctl -n hw.logicalcpu)" >> "$GITHUB_OUTPUT"
          else
            echo "jobs=$(nproc)" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure
        shell: bash
        run: |
          args=(
            -S "${{ github.workspace }}"
            -B "${{ steps.build.outputs.dir }}"
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
            -DQB_CXX_STANDARD=${{ matrix.cxx_standard }}
            -DQB_BUILD_TESTS=ON
            -DQB_BUILD_EXAMPLES=ON
            -DQB_BUILD_BENCHMARKS=ON
            -DQB_USE_SYSTEM_GTEST=ON
            # The suite can otherwise pass with TLS tests silently unregistered when OpenSSL
            # is unavailable: QB_WITH_SSL defaults to ON but its historical fallback is OFF.
            # QUIC stays AUTO, so an absent ngtcp2 OpenSSL helper does not fail this matrix.
            -DQB_WITH_SSL=ON
            -DQB_REQUIRE_FEATURES=ON
            # Not QB_USE_SYSTEM_BENCHMARK=ON: that switch is find_package(benchmark 1.9.5 REQUIRED),
            # and Ubuntu 24.04's libbenchmark-dev is 1.8.3 -- six red runs (d1897d3c..fa1c5ce3)
            # after the floor moved to 1.9.5 in 3da3b4d4. The default path considers the system
            # package first and falls back to the pinned v1.9.5 fetch when it is under the floor,
            # which is the behaviour the docs promise and what this lane now exercises.
            -DQB_ENABLE_NATIVE_ARCH=OFF
            # The opt-in codecs (Huly QB-79) are OFF by default; every lane builds and tests them.
            -DQB_WITH_ZSTD=ON
            -DQB_WITH_BROTLI=ON
          )

          if [ "$RUNNER_OS" != "Windows" ]; then
            args+=(
              -G Ninja
              -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
              -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
            )
          fi

          if [ -n "${VCPKG_TOOLCHAIN:-}" ]; then
            args+=(
              -DCMAKE_TOOLCHAIN_FILE="${VCPKG_TOOLCHAIN}"
              -DVCPKG_TARGET_TRIPLET=x64-windows
            )
          fi

          if [ -n "${OPENSSL_EXECUTABLE:-}" ]; then
            args+=(-DOPENSSL_EXECUTABLE="${OPENSSL_EXECUTABLE}")
          fi

          if [ "$RUNNER_OS" == "Linux" ]; then
            # The per-backend event-loop matrix (Huly QB-81): the four backend-sensitive binaries
            # and the anti-vacuity guard (event-loop-lifecycle) run once more per backend with
            # QB_EV_BACKEND in their environment -- ten extra ctest entries. io_uring comes up on
            # these hosted runners (qev's own lane measures per-backend-smoke iouring=MATCH); where
            # a kernel or a seccomp profile refuses it, the guard makes the io_uring variant FAIL
            # rather than let it test epoll under an io_uring name. Never measured before 3.2.0:
            # the backend went 47x slower than epoll on a quiet socket to parity once looked at.
            args+=("-DQB_IO_EV_TEST_BACKENDS=epoll;iouring")
          fi

          cmake "${args[@]}"

      - name: Assert SSL requested and compiled in
        shell: bash
        run: |
          set -euo pipefail
          cache="${{ steps.build.outputs.dir }}/CMakeCache.txt"
          grep -Fxq 'QB_WITH_SSL:BOOL=ON' "$cache" || {
            echo '::error::QB_WITH_SSL was not requested'; exit 1; }
          grep -Fxq 'QB_REQUIRE_FEATURES:BOOL=ON' "$cache" || {
            echo '::error::requested feature downgrade is not fatal'; exit 1; }
          defs="$(sed -n 's/^QB_COMPILE_DEFINITIONS:INTERNAL=//p' "$cache")"
          case ";${defs};" in
            *';QB_WITH_SSL=1;'*) ;;
            *) echo '::error::QB_WITH_SSL is absent from compiled definitions'; exit 1 ;;
          esac
          case ";${defs};" in
            *';QB_HAS_SSL=1;'*) ;;
            *) echo '::error::OpenSSL was requested but QB_HAS_SSL is absent from compiled definitions'; exit 1 ;;
          esac
          ctest --test-dir "${{ steps.build.outputs.dir }}" --show-only=json-v1 \
            > "${RUNNER_TEMP}/qb-ssl-registered.json"
          python3 - "${RUNNER_TEMP}/qb-ssl-registered.json" <<'PY'
          import json
          import os
          import sys

          expected = os.environ['QB_SSL_CTESTS'].split()
          names = [t['name'] for t in json.load(open(sys.argv[1]))['tests']]
          missing = [name for name in expected if names.count(name) != 1]
          print(f'TLS CTest registration: {len(expected) - len(missing)}/{len(expected)} required')
          if len(expected) < 3 or len(set(expected)) != len(expected) or missing:
              print(f'::error::TLS test registration missing or duplicated: {missing}')
              sys.exit(1)
          PY
          echo 'SSL requested and compiled in: QB_WITH_SSL=1, QB_HAS_SSL=1'

      - name: Negative control — missing OpenSSL must stop configuration
        if: matrix.name == 'ubuntu-gcc-cxx20-release'
        shell: bash
        run: |
          set -euo pipefail
          scratch="${RUNNER_TEMP}/qb-openssl-negative"
          set +e
          cmake -S "${GITHUB_WORKSPACE}" -B "$scratch" -G Ninja \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=TRUE \
            -DQB_WITH_SSL=ON -DQB_REQUIRE_FEATURES=ON -DQB_WITH_QUIC=OFF \
            -DQB_WITH_ZSTD=OFF -DQB_WITH_BROTLI=OFF \
            -DQB_BUILD_TESTS=OFF -DQB_BUILD_EXAMPLES=OFF -DQB_BUILD_BENCHMARKS=OFF \
            -DQB_INSTALL=OFF > "${RUNNER_TEMP}/qb-openssl-negative.log" 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo '::error::configuration accepted a requested but missing OpenSSL'; exit 1
          fi
          grep -Fq 'OpenSSL not found - SSL/TLS support disabled' "${RUNNER_TEMP}/qb-openssl-negative.log" || {
            cat "${RUNNER_TEMP}/qb-openssl-negative.log"
            echo '::error::negative configuration failed for a reason other than missing OpenSSL'; exit 1; }
          grep -Fq 'QB_REQUIRE_FEATURES=ON' "${RUNNER_TEMP}/qb-openssl-negative.log" || {
            echo '::error::OpenSSL downgrade was not made fatal by QB_REQUIRE_FEATURES'; exit 1; }
          echo "negative control caught unavailable OpenSSL (cmake exit $rc)"

          # Scope control: the same three tests must disappear when SSL is explicitly OFF.
          # Configure only; no binaries or extra suite are built or run.
          no_ssl="${RUNNER_TEMP}/qb-no-ssl-registration"
          cmake -S "${GITHUB_WORKSPACE}" -B "$no_ssl" -G Ninja \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
            -DQB_WITH_SSL=OFF -DQB_WITH_QUIC=OFF -DQB_REQUIRE_FEATURES=ON \
            -DQB_WITH_COMPRESSION=OFF -DQB_WITH_ZSTD=OFF -DQB_WITH_BROTLI=OFF \
            -DQB_USE_SYSTEM_GTEST=ON \
            -DQB_BUILD_TESTS=ON -DQB_BUILD_EXAMPLES=OFF -DQB_BUILD_BENCHMARKS=OFF \
            -DQB_INSTALL=OFF > "${RUNNER_TEMP}/qb-no-ssl-registration.log" 2>&1 || {
              cat "${RUNNER_TEMP}/qb-no-ssl-registration.log"; exit 1; }
          ctest --test-dir "$no_ssl" --show-only=json-v1 \
            > "${RUNNER_TEMP}/qb-no-ssl-registration.json"
          python3 - "${RUNNER_TEMP}/qb-no-ssl-registration.json" <<'PY'
          import json
          import os
          import sys

          expected = set(os.environ['QB_SSL_CTESTS'].split())
          names = [t['name'] for t in json.load(open(sys.argv[1]))['tests']]
          present = expected & set(names)
          always_on = 'qb-io-test-unit-crypto-nossl-core'
          print(f'SSL-OFF registration: TLS={len(present)}, always-on={names.count(always_on)}')
          if present or len(expected) < 3 or names.count(always_on) != 1:
              print(f'::error::SSL-OFF registration control failed: TLS={sorted(present)}, '
                    f'{always_on} count={names.count(always_on)}')
              sys.exit(1)
          PY

      - name: Build
        run: >
          cmake --build "${{ steps.build.outputs.dir }}"
          --config ${{ matrix.build_type }}
          --parallel ${{ steps.build.outputs.jobs }}

      - name: Test
        working-directory: ${{ steps.build.outputs.dir }}
        run: >
          ctest --build-config ${{ matrix.build_type }} --output-on-failure --parallel 4
          --output-junit "${{ runner.temp }}/qb-cmake-results.xml"

      - name: Assert TLS tests executed without CTest skips
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${{ runner.temp }}/qb-cmake-results.xml" <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          expected = os.environ['QB_SSL_CTESTS'].split()
          cases = list(ET.parse(sys.argv[1]).getroot().iter('testcase'))
          by_name = {name: [case for case in cases if case.get('name') == name]
                     for name in expected}
          missing = [name for name, matches in by_name.items() if len(matches) != 1]
          skipped = [name for name, matches in by_name.items()
                     if matches and matches[0].find('skipped') is not None]
          failed = [name for name, matches in by_name.items()
                    if matches and (matches[0].find('failure') is not None
                                    or matches[0].find('error') is not None)]
          executed = len(expected) - len(missing) - len(skipped)
          print(f'TLS CTest: registered={len(expected) - len(missing)} executed={executed} '
                f'skipped={len(skipped)} failed={len(failed)} floor>=3')
          if len(expected) < 3 or len(set(expected)) != len(expected) or missing or skipped or failed or executed < 3:
              print(f'::error::TLS CTest gate: missing={missing} skipped={skipped} failed={failed}')
              sys.exit(1)
          PY

  # Linux-only, and it has to be: the defect is a libstdc++ ABI-tag divergence between
  # clang and gcc, and libc++ has no cxx11 tag at all — so the macos-clang job above, and
  # the maintainer's own machine, are STRUCTURALLY BLIND to it. The matrix above cannot
  # see it either, however many rows it grows: every row compiles the whole tree with ONE
  # toolchain, and this class only exists where two of them meet in one binary.
  #
  # What it caught (cafc175a): clang appends `B5cxx11` to the mangled name of a
  # function-LOCAL STATIC whose type carries the cxx11 tag and gcc does not, so a
  # gcc-built consumer linked against a clang-built qb held TWO copies of ska's empty-map
  # sentinel — and deallocate_data() decides whether to free by comparing against it.
  # A map created on one side and destroyed on the other freed static storage:
  # "free(): invalid pointer", no link-time diagnostic, macOS clean.
  #
  # Seconds, not minutes: it compiles one probe TU twice and diffs symbol names. No qb
  # build, no dependencies beyond the two compilers.
  cross-compiler-statics:
    name: ubuntu-abi-sentinel-sweep
    runs-on: ubuntu-latest
    env:
      LLVM_VERSION: "22"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          ./scripts/ci-install-linux-dependencies.sh --gcc-14 --llvm-clang
          gcc-14 --version
          "clang-${LLVM_VERSION}" --version

      - name: Sweep for divergent function-local statics
        run: |
          CLANGXX="clang++-${LLVM_VERSION}" GXX=g++-14 \
            ./scripts/check-cross-compiler-statics.sh

      # A check that has never failed is not known to work. This reverts the fix in a
      # SCRATCH COPY of the two vendored headers, asserts the sweep goes red, and puts
      # them back — so a green result above means "the two compilers agree", never "the
      # probe stopped instantiating anything".
      - name: Negative control — the sweep must fail on the pre-fix headers
        run: |
          set -euo pipefail
          um=src/qb/vendor/ska_hash/unordered_map.hpp
          fm=src/qb/vendor/ska_hash/flat_hash_map.hpp
          cp "$um" /tmp/um.keep && cp "$fm" /tmp/fm.keep
          restore() { cp /tmp/um.keep "$um"; cp /tmp/fm.keep "$fm"; }
          trap restore EXIT

          # sherwood_v10_entry::empty_pointer — the qb::unordered_map sentinel, fixed by
          # hoisting it to an inline static DATA member. Put it back in the function.
          python3 - "$um" <<'PY'
          import sys
          p = sys.argv[1]; s = open(p).read()
          s = s.replace("    inline static EntryPointer empty_table[3] = {EntryPointer(1), nullptr, nullptr};\n", "")
          s = s.replace("        return empty_table + 1;",
                        "        static EntryPointer result[3] = {EntryPointer(1), nullptr, nullptr};\n        return result + 1;")
          open(p, "w").write(s)
          PY
          # sherwood_v3_entry::empty_default_table — the qb::unordered_flat_map sentinel,
          # fixed by giving the static tag-free storage. Put the tagged array back.
          python3 - "$fm" <<'PY'
          import re, sys
          p = sys.argv[1]; s = open(p).read()
          s = re.sub(r"        alignas\(sherwood_v3_entry\) static unsigned char storage.*?return std::launder\(reinterpret_cast<sherwood_v3_entry \*>\(storage\)\);",
                     "        static sherwood_v3_entry result[min_lookups] = {{}, {}, {}, {special_end_value}};\n        return result;",
                     s, flags=re.S)
          open(p, "w").write(s)
          PY

          for f in "$um" "$fm"; do
            git diff --quiet -- "$f" && { echo "::error::$f was not modified — the control never armed"; exit 1; }
          done

          # The exit code has to be EXACTLY 1. Accepting "non-zero" is how this control
          # gives a false pass: a botched revert that merely breaks the build exits 2,
          # which reads as failure and would have been scored as "the sweep caught it".
          # Measured — that is not hypothetical, it happened while writing this job.
          set +e
          CLANGXX="clang++-${LLVM_VERSION}" GXX=g++-14 \
            ./scripts/check-cross-compiler-statics.sh > /tmp/control.log 2>&1
          rc=$?
          set -e
          sed 's/^/    /' /tmp/control.log

          case "$rc" in
            1) : ;;
            0) echo "::error::the sweep PASSED on the pre-fix headers — it cannot detect the defect it exists for"; exit 1 ;;
            *) echo "::error::the sweep could not run (exit $rc). The revert broke the probe instead of arming it — this is NOT a detection."; exit 1 ;;
          esac
          grep -q 'DIVERGENT function-local static' /tmp/control.log || {
            echo "::error::exit 1 with no divergence reported — the sweep failed for some other reason"; exit 1; }
          echo "negative control fired: exit 1, $(grep -c 'DIVERGENT' /tmp/control.log) divergent statics on the pre-fix sentinels."

      - name: Working tree restored
        run: git diff --exit-code -- src/qb/vendor/ska_hash/
