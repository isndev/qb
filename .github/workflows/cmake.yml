name: cmake

# SCRATCH, never to merge (Huly QB-1270 part 3): this branch replaces qb's cmake workflow with ONE job on the
# macOS image the lane runs, which measures where the close_notify witness went red with OpenSSL 4.1 --
# diag/macos-oracle.sh: the system, a probe of OpenSSL and the kernel alone, then qb built against openssl@4 and
# against openssl@3: the tree as committed (the candidate), and its tests over the base's src/ (the red run).

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "suite (the candidate's every test, both builds) or witness (the witness targets alone)"
        required: false
        default: suite
      base:
        description: "the commit whose src/ the red run builds (empty: no red run)"
        required: false
        default: d46e21b29f2e7b14b52092a4dcc9da6d6c90b9ee

permissions:
  contents: read

concurrency:
  group: cmake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-oracle:
    name: macos-tls-oracle
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install dependencies as the lane does, and openssl@3 beside it
        run: |
          ./scripts/ci-install-macos-dependencies.sh --profile build
          brew install openssl@3 openssl@4
          brew list --versions openssl@3 openssl@4 libngtcp2

      - name: The oracle
        run: bash diag/macos-oracle.sh "${{ runner.temp }}/oracle" "${{ inputs.scope || 'suite' }}" "${{ inputs.base }}"

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos-tls-oracle-${{ github.run_id }}
          path: ${{ runner.temp }}/oracle
          retention-days: 14
