name: coverage

# SCRATCH, never to merge (QB-200 shape, 2026-11-13): qb's coverage lane SEGFAULTs in
# qb-io-test-unit-over-aligned-promise on ubuntu-latest = Ubuntu 26.04, whose g++-14 is 14.3.0 -- on develop
# (4401d31df) and on int/340-t7 alike, green on 24.04's 14.2.0 (run 42844596263). This job builds that one test in
# several configurations, runs each, and runs a crash under gdb: the backtrace, the registers, the instructions at the
# fault, so that a compiler defect and a qb defect can be told apart. Every configuration's verdict is printed.

on:
  workflow_dispatch:
    inputs:
      variants:
        description: "space-separated: cov14 dbg14 cov14nocov o1 dbg15 dbgclang asan14"
        required: false
        default: "cov14 dbg14 dbg15 dbgclang asan14"

permissions:
  contents: read

jobs:
  diag:
    name: over-aligned-promise-gcc-oracle
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies as the coverage lane does, gdb and g++-15 beside them
        run: |
          ./scripts/ci-install-linux-dependencies.sh --profile coverage
          sudo apt-get install -y gdb g++-15 || sudo apt-get install -y gdb
          mkdir -p "${RUNNER_TEMP}/oracle"
          { cat /etc/os-release | head -3; gcc-14 --version | head -1; g++-15 --version 2>/dev/null | head -1; clang++-22 --version 2>/dev/null | head -1; gdb --version | head -1; git rev-parse HEAD; } | tee "${RUNNER_TEMP}/oracle/host.txt"

      - name: Build and run each variant
        run: |
          set -uo pipefail
          o="${RUNNER_TEMP}/oracle"
          t=qb-io-test-unit-over-aligned-promise
          common=(-G Ninja -DQB_CXX_STANDARD=20 -DQB_BUILD_EXAMPLES=OFF -DQB_BUILD_BENCHMARKS=OFF -DQB_USE_SYSTEM_GTEST=ON
                  -DQB_ENABLE_NATIVE_ARCH=OFF -DOPENSSL_EXECUTABLE="${OPENSSL_EXECUTABLE:-}")
          for v in ${{ inputs.variants }}; do
            case "$v" in
              cov14)      args=(--preset coverage -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 -DGCOV_PATH="${GCOV_PATH:-}") ;;
              dbg14)      args=(-DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14) ;;
              o1)         args=(-DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS=-O1 -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14) ;;
              dbg15)      args=(-DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=gcc-15 -DCMAKE_CXX_COMPILER=g++-15) ;;
              dbgclang)   args=(-DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22) ;;
              asan14)     args=(-DCMAKE_BUILD_TYPE=Debug -DQB_SANITIZE=address,undefined -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14) ;;
              *) echo "unknown variant $v"; continue ;;
            esac
            b="build-$v"
            if [ "${args[0]}" = "--preset" ]; then
              cmake "${args[@]}" "${common[@]}" -B "$b" > "$o/$v-configure.log" 2>&1
            else
              cmake -S . -B "$b" "${args[@]}" "${common[@]}" > "$o/$v-configure.log" 2>&1
            fi
            echo "$v: configure $?" | tee -a "$o/verdicts.txt"
            cmake --build "$b" --target "$t" > "$o/$v-build.log" 2>&1; echo "$v: build $?" | tee -a "$o/verdicts.txt"
            bin="$(find "$b" -type f -name "$t" -perm -u+x | head -1)"
            [ -n "$bin" ] || { echo "$v: no binary" | tee -a "$o/verdicts.txt"; continue; }
            (cd "$(dirname "$bin")" && timeout 120 "./$t") > "$o/$v-run.log" 2>&1; rc=$?
            echo "$v: run exit $rc (declared order)" | tee -a "$o/verdicts.txt"; tail -4 "$o/$v-run.log"
            for f in '*TaskOverAWideValueRoundTrips*' '*HandleFromPromiseRoundTripsAndResumes*'; do
              (cd "$(dirname "$bin")" && timeout 60 "./$t" --gtest_filter="$f") > /dev/null 2>&1
              echo "$v: run exit $? alone $f" | tee -a "$o/verdicts.txt"
            done
            bad=""
            for seed in $(seq 1 30); do
              (cd "$(dirname "$bin")" && timeout 60 "./$t" --gtest_shuffle --gtest_random_seed=$seed) > "$o/$v-seed-$seed.log" 2>&1; r=$?
              order="$(grep -oE 'RUN +\] [A-Za-z_.]+' "$o/$v-seed-$seed.log" | sed -E 's/.*\.//' | tr '\n' ' ')"
              echo "$v seed $seed: exit $r order: $order" >> "$o/$v-seeds.txt"
              if [ $r -ne 0 ] && [ -z "$bad" ]; then bad=$seed; fi
            done
            echo "$v: $(grep -c 'exit 0 ' "$o/$v-seeds.txt") of 30 shuffled runs exit 0; first failing seed: ${bad:-none}" | tee -a "$o/verdicts.txt"
            awk -F'exit | order: ' '{print $2 " | " $3}' "$o/$v-seeds.txt" | sort | uniq -c
            if [ $rc -ne 0 ] || [ -n "$bad" ]; then
              extra=(); if [ -n "$bad" ]; then extra=(--gtest_shuffle "--gtest_random_seed=$bad"); fi
              (cd "$(dirname "$bin")" && gdb -batch -ex run -ex bt -ex 'info registers rip rsp rbp rdi rsi rax' \
                 -ex 'x/16i $pc-32' -ex 'frame 1' -ex 'info frame' --args "./$t" "${extra[@]}") > "$o/$v-gdb.log" 2>&1
              sed -n '/received signal/,$p' "$o/$v-gdb.log" | head -70
              objdump -d --no-show-raw-insn -C "$bin" > "$o/$v-objdump.txt" 2>/dev/null || true
            fi
          done
          echo "== verdicts"; cat "$o/verdicts.txt"

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gcc-oracle-${{ github.run_id }}
          path: ${{ runner.temp }}/oracle
          retention-days: 14
