name: coverage

# The one workflow deliberately NOT extended to `develop` pull requests.
#
# Every other workflow renders a verdict a reviewer can act on -- it compiles, the suite passes,
# ASan/TSan are clean, the install is consumable -- so running it before merge is what makes the
# PR mean something. This one renders no verdict: it builds instrumented, generates lcov +
# Cobertura, uploads them as artifacts, and exits 0 regardless of what the numbers say. There is
# no threshold gate to fail. On a PR that costs the most expensive job in the battery (a full
# instrumented build plus the whole suite) to produce a report nobody blocks a merge on.
#
# Nothing is lost by holding it: `push: [main, develop]` below still runs it on every push to
# develop, so the coverage trend for the development line is exactly as complete as before.
# Add `develop` here the day a coverage threshold actually gates the merge.
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          ./scripts/ci-install-linux-dependencies.sh --profile coverage
          gcc-14 --version

      - name: Configure
        run: >
          cmake --preset coverage -G Ninja
          -DCMAKE_C_COMPILER=gcc-14
          -DCMAKE_CXX_COMPILER=g++-14
          -DQB_CXX_STANDARD=20
          -DQB_BUILD_EXAMPLES=OFF
          -DQB_USE_SYSTEM_GTEST=ON
          -DQB_ENABLE_NATIVE_ARCH=OFF
          -DGCOV_PATH="${GCOV_PATH}"
          -DOPENSSL_EXECUTABLE="${OPENSSL_EXECUTABLE}"

      - name: Build
        run: cmake --build --preset coverage --parallel "$(nproc)"

      - name: Generate lcov report
        run: cmake --build build/coverage --target qb-coverage --parallel "$(nproc)"

      - name: Generate Cobertura XML
        run: cmake --build build/coverage --target qb-coverage-xml --parallel "$(nproc)"

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v6
        with:
          name: qb-coverage
          if-no-files-found: error
          path: |
            build/coverage/qb-coverage/
            build/coverage/qb-coverage.info
            build/coverage/qb-coverage-xml.xml
