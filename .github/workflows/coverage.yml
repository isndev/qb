name: coverage

on:
  push:
    branches:
      - 'c\+\+23'
  pull_request:
    branches:
      - 'c\+\+23'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          ./scripts/ci-install-linux-dependencies.sh --gcc-14 --coverage --google-test --quic
          gcc-14 --version

      - name: Configure
        run: >
          cmake --preset coverage -G Ninja
          -DCMAKE_C_COMPILER=gcc-14
          -DCMAKE_CXX_COMPILER=g++-14
          -DQB_CXX_STANDARD=20
          -DQB_BUILD_EXAMPLES=OFF
          -DQB_USE_SYSTEM_GTEST=ON
          -DQB_ENABLE_NATIVE_ARCH=OFF
          -DGCOV_PATH="${GCOV_PATH}"
          -DOPENSSL_EXECUTABLE="${OPENSSL_EXECUTABLE}"

      - name: Build
        run: cmake --build --preset coverage --parallel "$(nproc)"

      - name: Generate lcov report
        run: cmake --build build/coverage --target qb-coverage --parallel "$(nproc)"

      - name: Generate Cobertura XML
        run: cmake --build build/coverage --target qb-coverage-xml --parallel "$(nproc)"

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v6
        with:
          name: qb-coverage
          if-no-files-found: error
          path: |
            build/coverage/qb-coverage/
            build/coverage/qb-coverage.info
            build/coverage/qb-coverage-xml.xml
