name: coverage

on:
  push:
    branches: [main, develop, c++23, experimental-c++23]
  pull_request:
    branches: [main, develop, c++23, experimental-c++23]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcovr \
            lcov \
            libargon2-dev \
            libssl-dev \
            ninja-build \
            pkg-config \
            zlib1g-dev
          if apt-cache show libngtcp2-crypto-ossl-dev >/dev/null 2>&1; then
            sudo apt-get install -y libngtcp2-dev libngtcp2-crypto-ossl-dev
          else
            echo "::notice::libngtcp2-crypto-ossl-dev is not available through apt on this ubuntu-latest image; using Linuxbrew libngtcp2 for QUIC auto-detection."
            if ! command -v brew >/dev/null 2>&1; then
              eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            fi
            brew install libngtcp2
            export CMAKE_PREFIX_PATH="$(brew --prefix);$(brew --prefix libngtcp2);$(brew --prefix openssl@3)"
            export PKG_CONFIG_PATH="$(brew --prefix libngtcp2)/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            export LD_LIBRARY_PATH="$(brew --prefix libngtcp2)/lib:$(brew --prefix openssl@3)/lib:${LD_LIBRARY_PATH:-}"
            echo "CMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
            echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
            echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
            pkg-config --exists libngtcp2_crypto_ossl
          fi

      - name: Configure
        run: >
          cmake --preset coverage -G Ninja
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++
          -DQB_BUILD_EXAMPLES=OFF
          -DQB_ENABLE_NATIVE_ARCH=OFF

      - name: Build
        run: cmake --build --preset coverage --parallel "$(nproc)"

      - name: Generate lcov report
        run: cmake --build build/coverage --target qb-coverage --parallel "$(nproc)"

      - name: Generate Cobertura XML
        run: cmake --build build/coverage --target qb-coverage-xml --parallel "$(nproc)"

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v6
        with:
          name: qb-coverage
          if-no-files-found: error
          path: |
            build/coverage/qb-coverage/
            build/coverage/qb-coverage.info
            build/coverage/qb-coverage-xml.xml
